<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Starbase Defender</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
     :root {
       --color-primary: #0ff;
       --color-accent: #08f;
       --color-bg-dark: #111;
       --font-mono: monospace;
       --panel-font-size: clamp(14px, 3.4vw, 30px);
     }
     body {
       margin:0;
       padding:0;
       background:#000;
       overflow:hidden;
       font-family: Arial, sans-serif;
     }
     button {
       font-family: inherit;
       cursor: pointer;
     }

     #gameContainer {
       display: flex;
       flex-direction: column;
       height: 100vh; /* dvh未対応ブラウザ向けのフォールバック */
       height: 100dvh; /* ツールバーの表示/非表示に追従する実際の可視高さ */
     }
     
     #statusPanel {
       background: var(--color-bg-dark);
       color: var(--color-primary);
       padding:15px;
       flex: 0 0 auto;
       /* 縦画面ではステータス欄が肥大化して宇宙域を圧迫しないよう上限を設ける
          （横画面では下の @media で解除し、これまで通りサイドパネル全高を使う） */
       max-height: 40vh;
       max-height: 40dvh;
       border-bottom:2px solid var(--color-accent);
       overflow-y:auto;
       font-size: var(--panel-font-size);
       font-family: var(--font-mono);
       line-height: 1.1;
     }
     #statusPanel div {
       margin: 1px 5px;
     }

     #statusPanel .status-header {
       display: flex;
       background: #0a0a2a;
       justify-content: space-between;
       align-items: flex-end;
       border-bottom: 1px dashed var(--color-primary);
       padding-bottom: 6px;
       margin-bottom: 10px !important;
       flex-wrap: wrap;
     }
     #statusPanel .status-header span {
       margin: 0; /* 親の margin 指定をリセット */
     }
     #statusPanel .game-title {
       font-size: 1.1em;
       font-weight: bold;
       color: #fff;
       letter-spacing: 1px;
     }
     #statusPanel .game-credits {
       font-size: 0.8em;
       color: var(--color-accent)
     }
     
     #statusPanel .status-gauge {
       display: inline-block;
       width: 60px;
       height: 1.0em;
       background: #222;
       border: 1px solid var(--color-accent);
       margin-left: 8px;
       vertical-align: middle;
     }
     #statusPanel .status-gauge-fill {
       height: 100%;
       width: 100%;
       background: #0f0;
       transition: width 0.2s ease, background-color 0.2s ease;
       margin: 0;
     }

     #logStatus {
       height: 90px;
       line-height: 1.2;
       overflow-y: auto;
       background: #000;
       border: 1px solid rgba(0, 255, 255, 0.2);
       padding: 4px;
       margin-top: 5px !important;
     }
     #logStatus .log-line {
       margin: 2px 0;
       padding: 1px 4px;
       border-radius: 2px;
     }

     #gameWrapper {
       position: relative;
       flex: 1;
       min-height: 0;
       display: flex;             /* 追加: フレックスボックス化 */
       justify-content: flex-start; /* 追加: 左詰め */
       align-items: flex-start;     /* 追加: 上詰め */
       background: #000;          /* 余白部分を黒に */
     }
     #gameCanvas {
       width: 100%;
       height: 100%;
       max-width: 100%;
       max-height: 100%;
       aspect-ratio: 1 / 1;       /* 追加: 常に正方形を保つことで見切れと間延びを防止 */
     }

     #zoomUI {
       position: absolute;
       top: 10px;
       left: 10px;
       display: flex;
       flex-direction: column;
       gap: 10px;
       z-index: 1000;
     }
     #zoomUI button {
       /* タップしやすい最小サイズ(48px)は確保しつつ、画面が小さい端末では
          宇宙域を圧迫しないよう viewport 幅に応じて縮小する */
       width: clamp(48px, 11vw, 68px);
       height: clamp(48px, 11vw, 68px);
       font-size: clamp(24px, 6vw, 34px);
       background: rgba(0, 136, 255, 0.5);
       color: #fff;
       border: 2px solid var(--color-primary);
       border-radius: 30px;
       user-select: none;
     }
     #zoomUI button:active {
       background: rgba(0, 255, 255, 0.8);
       color: #000;
     }

     .panel-btn {
       font-size: 0.9em;
       background: transparent;
       color: var(--color-primary);
       border: 1px solid var(--color-primary);
       padding: 3px 8px;
       border-radius: 3px;
       margin-left: 10px;
       vertical-align: middle;
       transition: background 0.12s, color 0.12s;
     }
     .panel-btn:hover {
       background: var(--color-primary);
       color: #000;
     }

     #highScoreOverlay {
       display: none;
       position: fixed;
       inset: 0;
       background: rgba(0, 0, 20, 0.5);
       z-index: 9999;
       align-items: center;
       justify-content: center;
       font-family: var(--font-mono);
     }
     #hsPanel {
       border: 2px solid var(--color-primary);
       padding: 28px 32px;
       min-width: 500px;
       max-width: 800px;
       width: 92%;
       background: rgba(8, 8, 32, 0.5);
       box-shadow: 0 0 40px rgba(0,255,255,0.9);
     }
     #hsResultMsg {
       text-align: center;
       font-size: clamp(28px, 5vw, 40px);
       letter-spacing: 3px;
       margin: 0 0 6px 0;
     }
     #hsFinalMsg {
       color: #8df;
       text-align: center;
       font-size: clamp(24px, 2.5vw, 40px);
       margin: 0 0 16px 0;
       padding-bottom: 14px;
       border-bottom: 1px solid rgba(0,255,255,0.25);
     }
     .hs-heading {
       color: var(--color-primary);
       font-size: clamp(28px, 3.5vw, 40px);
       letter-spacing: 2px;
       margin-bottom: 8px;
     }
     #hsTableWrap {
       overflow-x: auto;
     }
     #hsTable {
       width: 100%;
       border-collapse: collapse;
       font-size: clamp(24px, 3.2vw, 30px);
       color: #9cf;
       min-width: 260px;
     }
     #hsTable th,
     #hsTable td {
       padding: 6px;
       white-space: nowrap;
     }
     #hsTable th {
       color: var(--color-primary);
       text-align: left;
       padding-top: 4px;
       padding-bottom: 4px;
       border-bottom: 1px solid rgba(0,255,255,0.3);
       letter-spacing: 1px;
     }
     #hsTable tbody tr.hs-new td {
       color: #ff0;
     }
     #hsTable tbody tr {
       cursor: pointer;
       transition: background-color 0.2s;
     }
     #hsTable tbody tr:hover {
       background-color: rgba(0, 255, 255, 0.15);
     }
     #hsNoRecord {
       color: #444;
       text-align: center;
       padding: 14px;
       font-size: clamp(24px, 2.2vw, 40px);
     }
     #hsBtns {
       display: flex;
       gap: 12px;
       justify-content: center;
       margin-top: 20px;
       flex-wrap: wrap;
     }
     .hs-btn {
       padding: 11px 20px;
       font-size: clamp(24px, 2.8vw, 40px);
       background: rgba(0, 100, 200, 0.3);
       color: var(--color-primary);
       border: 2px solid var(--color-primary);
       border-radius: 4px;
       letter-spacing: 1px;
       transition: background 0.15s, color 0.15s;
     }
     .hs-btn:hover,
     .hs-btn:active {
       background: var(--color-primary);
       color: #000;
     }

     @media (orientation: landscape) {
       #gameContainer {
         flex-direction: row;
       }
       #statusPanel {
         width: 320px; /* 適切な固定幅を指定 */
         max-height: none; /* 縦画面用の上限を解除し、サイドパネルとして全高を使う */
         height: 100vh; /* dvh未対応ブラウザ向けのフォールバック */
         height: 100dvh; /* ツールバーの表示/非表示に追従する実際の可視高さ */
         border-bottom: none;
         border-right: 2px solid var(--color-accent);
       }
       /* 横長画面でのパネル内のフォントサイズ微調整 */
       :root {
         --panel-font-size: clamp(16px, 2vw, 22px);
       }
     }
    </style>
  </head>
  <body>
    <div id="gameContainer">
      <div id="statusPanel">
        <div class="status-header">
          <span class="game-title">StarBase Defender v0.3.17</span>
          <div class="game-credits">&copy; 2026 Yoichi Tanibayashi</div>
        </div>
        <div>
          Turn
          <span id="statusMission">1</span>-<span id="statusTurn">1</span>
          <button class="panel-btn" id="viewScoresBtn">SCORE
            <span id="statusScore">100</span>
          </button>
        </div>
        <div>
          Shield
          <div class="status-gauge"><div id="gaugeShipShield" class="status-gauge-fill"></div></div>
          <span id="statusShipShield">0</span>
        </div>
        <div>
          Energy
          <div class="status-gauge"><div id="gaugeShipEnergy" class="status-gauge-fill"></div></div>
          <span id="statusShipEnergy">0</span>
        </div>
        <div>
          Base Shield
          <div class="status-gauge"><div id="gaugeBaseShield" class="status-gauge-fill"></div></div>
          <span id="statusBaseShield">0</span>
        </div>
        <div>
          Federation
          <span id="statusFederationShipCount">1</span>
        </div>
        <div>
          Enemy
          <span id="statusEnemyShipCount">1</span>
        </div>
        <div id="logStatus"></div>
      </div>
      
      <div id="gameWrapper">
        <div id="gameCanvas"></div>
        <div id="zoomUI">
          <button id="zoomIn">＋</button>
          <button id="zoomOut">－</button>
        </div>
      </div>
    </div>

    <div id="highScoreOverlay">
      <div id="hsPanel">
        <h2 id="hsResultMsg"></h2>
        <p id="hsFinalMsg"></p>
        <div class="hs-heading">▶ HIGH SCORES ◀</div>
        <div id="hsTableWrap">
          <table id="hsTable">
            <thead>
              <tr>
                <th></th>
                <th>RANK</th>
                <th>SCORE</th>
                <th>MISSION</th>
                <th>TURNS</th>
                <th>DATE</th>
              </tr>
            </thead>
            <tbody id="hsTableBody"></tbody>
          </table>
          <div id="hsNoRecord">--- NO RECORDS YET ---</div>
        </div>
        <div id="hsBtns">
          <button class="hs-btn" id="hsRestartBtn">▶ RESTART</button>
          <button class="hs-btn" id="hsCloseBtn">✕ CLOSE</button>
        </div>
      </div>
    </div>
    
    <script>
     "use strict";
     // ---------------------------------------------------------
     // 設定・定数の定義
     // ---------------------------------------------------------
     const GAME_ID = Phaser.Utils.String.UUID();

     const TIMING = {
       BEAM_DUR: 400,
       TURN_DELAY: 400,
       TURN_MARGIN: 0,
       MISSION_OVER: 3000,
       ENEMY_DELAY_MAX: 500, // 敵艦の動作のズレ
     };

     const QTY = {
       STAR: 30,
       ENEMY: 3,
     };

     const NEW_ENEMY_INTERVAL = 25;
     const NEW_FEDERATION_INTERVAL = 40;  // TBD
     
     const SCALE = 0.5;

     const AREA_R = 300;

     const PLAY_AREA = {
       WIDTH: AREA_R * 2 + 30,
       HEIGHT: AREA_R * 2 + 30,
     };
     const AREA_CENTER = {
       X: PLAY_AREA.WIDTH / 2,
       Y: PLAY_AREA.HEIGHT / 2,
     };

     const CAMERA = {
       ZOOM_MIN: 1.0,
       ZOOM_MAX: 4.0,
       STEP: 2.0,
     };
     let CurZoom = 1.0;

     const SCORE = {
       INIT: 100,
       DESTROY_PENALTY: 50,
     };
     const HIGHSCORE = {
       MAX_ENTRIES: 5,
       STORAGE_KEY: 'starbaseDefenderScores'
     };

     // デバッグログの有効/無効切り替え。開発時に true にすると各種ログが出力される。
     const DEBUG = false;

     /**
      * デバッグ用ログ出力（DEBUG=true のときのみ console.log する）
      */
     function debugLog(...args) {
       if (DEBUG) {
         console.log(...args);
       }
     } // debugLog()

     /**
      * ゲーム進行状態（ターン・スコア・ミッション進行・シーン参照など）を
      * カプセル化するクラス。gameObjs と同様、単一インスタンスとして扱う。
      */
     class GameState {
       constructor() {
         this.turn = 1;
         this.curMission = 1;
         this.score = SCORE.INIT;
         this.isPlayerTurn = true;
         this.isGameOver = false;
         this.flagClear = false;
         this.pendingScene = null;
         this.curScene = null;
         this.qtyFederationShip = 0;
       }
     } // class GameState

     // グローバルなゲーム進行状態インスタンス
     const gameState = new GameState();

     let rangeGraphics, boundaryGraphics;

     // ---------------------------------------------------------
     // グローバルメソッド
     // ---------------------------------------------------------

     /**
      * 生存中の連邦艦の数（自機は含まない）
      */
     function getActiveFederationShipCount() {
       return gameObjs.federationShips.filter(f => f.active).length;
     } // getActiveFederationShipCount()

     /**
      * 生存中の敵艦の数。
      * 配列には撃破・撤退済みの艦が残っている場合があるため、
      * 表示や判定には必ずこの関数を通した数を使う。
      */
     function getActiveEnemyCount() {
       return gameObjs.enemies.filter(enemy => enemy.active).length;
     } // getActiveEnemyCount()

     /**
      * ゲージの描画
      */     
     function drawGauge(g, cx, cy, width, height, ratio, color) {
       g.clear();
       if ( !isFinite(cy) ) {
         return;
       }

       const x = cx - width / 2;
       const y = cy - height / 2;
       
       g.fillStyle(0x888888, 1);
       g.fillRect(x, y, width, height);
       
       const r = Math.max(0, Math.min(1, ratio));
       if (r > 0) {
         g.fillStyle(color, 1);
         g.fillRect(x, y, width * r, height);
       }
     } // drawGauge()

     /**
      * 宇宙域境界の描画
      */
     function drawBoundary(){
       boundaryGraphics.clear();
       boundaryGraphics.lineStyle(2, 0x0088ff, 1);
       boundaryGraphics.strokeCircle(AREA_CENTER.X, AREA_CENTER.Y, AREA_R);
     } // drawBoundary()

     /**
      * 戦況ログに1行追加する（複数行スクロール対応）。
      * 発信者を必ず伴わせることで、どの担当からの報告かを一目で判別できるようにする。
      * @param {string} from 発信者（操舵手・戦術士官・機関部など）
      * @param {string} msg 表示するテキスト（空文字の場合はログを全消去）
      * @param {string} fg 文字色。緊急度を色で示すために使う
      */
     function setMsg(from="", msg="", fg="#0ff") {
       const el = document.getElementById('logStatus');
       
       // msgが空文字（ゲームオーバー時などの画面クリア命令）の場合は全消去
       if (!msg) {
         el.innerHTML = '';
         return;
       }

       let msgstr = from + '>' + msg;
       
       let s = String(gameState.curMission).padStart(3,"0");
       s += ".";
       s += String(gameState.turn).padStart(4,"0");
       s += " "
       s += msgstr;
       msgstr = s;

       // 新しいログ行のDOM要素を作成
       const line = document.createElement('div');
       line.className = 'log-line';
       line.style.color = fg;
       line.textContent = msgstr;

       // ログ領域の末尾に追加
       el.appendChild(line);

       // メモリ及びパフォーマンス対策: ログが50行を超えたら古い行から削除
       const maxLines = 50;
       while (el.children.length > maxLines) {
         el.removeChild(el.firstChild);
       }

       // 最新のメッセージが見えるように最下部へスクロール位置を調整
       el.scrollTop = el.scrollHeight;
     } // setMsg()

     /**
      * 艦載フェイザーアレイ 照射音ジェネレーター
      * @param {boolean} isPlayer 
      */
     function playBeamSound(isPlayer) {
       if (!window.audioCtx) {
         window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
       }
       if (window.audioCtx.state === 'suspended') {
         window.audioCtx.resume();
       }

       const ctx = window.audioCtx;
       let now = ctx.currentTime

       // ビームの持続時間（TIMING.BEAM_DURに合わせて500ms）
       let duration = TIMING.BEAM_DUR / 1000;
       if ( ! isPlayer ) {
         duration = TIMING.BEAM_DUR / 1000 / 3 * 2;
       }

       // 1. エンベロープ用ゲイン（音量の時間変化）
       const envelope = ctx.createGain();
       envelope.gain.setValueAtTime(0, now);
       envelope.gain.linearRampToValueAtTime(0.3, now + 0.02); // 瞬時に立ち上がる
       envelope.gain.linearRampToValueAtTime(0.2, now + duration * 0.3); // 持続
       envelope.gain.linearRampToValueAtTime(0.1, now + duration * 0.6); // 持続
       envelope.gain.linearRampToValueAtTime(0.05, now + duration * 0.8); // 持続
       envelope.gain.linearRampToValueAtTime(0, now + duration); // 鋭く遮断

       // 2. メインオシレーター（鋸歯状波で厚みのある音色を作る）
       const osc = ctx.createOscillator();
       osc.type = 'sawtooth';
       if ( isPlayer ) {
         osc.frequency.setValueAtTime(800, now);
       } else {
         osc.frequency.setValueAtTime(600, now);
       }
       
       // 3. フィルター（高音域を強調し、エネルギー感を出す）
       const filter = ctx.createBiquadFilter();
       filter.type = 'lowpass';
       filter.frequency.setValueAtTime(2000, now);
       filter.Q.value = 10;

       // 4. LFO（ウネリの生成）
       // 25Hzで揺らすことでTNG以降のフェイザー特有の「ビームが振動している感じ」を作る
       const lfo = ctx.createOscillator();
       lfo.type = 'sine';
       lfo.frequency.value = 20;
       const lfoGain = ctx.createGain();
       lfoGain.gain.value = 150; // 揺らぎの深さ
       //lfoGain.gain.value = 200; // 揺らぎの深さ

       // ルーティング
       lfo.connect(lfoGain);
       lfoGain.connect(osc.frequency); // 周波数を揺らす（ビブラート）
       
       osc.connect(filter);
       filter.connect(envelope);
       envelope.connect(ctx.destination);

       // 再生
       osc.start(now);
       lfo.start(now);
       osc.stop(now + duration);
       lfo.stop(now + duration);
     } // playBeamSound()
     
     // ---------------------------------------------------------
     // クラス定義
     // ---------------------------------------------------------

     /**
      * 空間内のオブジェクトを管理するコンテキスト
      */
     class GameObjs {
       constructor() {
         this.player = null;
         this.starBase = null;
         this.federationShips = [];
         this.enemies = [];
         this.stars = [];
       }

       findObjectAt(x, y) {
         // 配列の先頭から優先的に評価（敵艦 -> 基地 -> 自機）
         const clickables = [...this.enemies, this.starBase, this.player];
         return clickables.find(e => {
           if (!e || !e.active) return false;
           return Phaser.Math.Distance.Between(x, y, e.x, e.y) < e.r;
         });
       }

       // 敵の追加・削除を管理
       addEnemy(enemy) {
         this.enemies.push(enemy);
       }
       removeEnemy(enemy) {
         this.enemies = this.enemies.filter(e => e !== enemy);
       }

       // 連邦艦の追加を管理
       addFederation(ship) {
         this.federationShips.push(ship);
       }

       // 衝突判定や描画ループで使用する障害物リストを生成
       getObstacles(ignoreObj = null) {
         return [
           this.starBase,
           ...this.stars,
           ...this.enemies,
           ...this.federationShips
         ].filter(o => o && o.active && o !== ignoreObj);
       }
     } // GameObjs

     // グローバルなコンテキストインスタンス
     const gameObjs = new GameObjs();

     /**
      * 兵器クラス
      */
     class Weapon {
       static MAX_DAMAGE_RATIO = 0.2;  // 最大射程距離のダメージ比率
       
       constructor(max_power, area_r, cost=0) {
         debugLog(`Weapon> max_power=${max_power}, area_r=${area_r}, const=${cost}`);
         this.max_power = max_power;
         this.area_r = area_r;
         this.cost = cost;
       }
       
       EffectiveRange() {
         return this.area_r;
       }
       
       MaxRange() {
         return Math.floor(this.area_r * Math.sqrt(1 / this.constructor.MAX_DAMAGE_RATIO - 1));
       }

       /**
        * 距離に応じた武器の威力減衰率（有効度）を計算する
        */
       Effectiveness(distance) {
         const x = distance / this.area_r;
         return 1 / (1 + x * x);
       }

       CalcDamage(distance) {
         return Math.floor(this.max_power * this.Effectiveness(distance));
       }
     } // class Weapon

     /**
      * 空間に存在する全オブジェクトの基底クラス。
      * 座標とサイズは Phaser のスプライトへ委譲しており、ゲームロジック側は
      * スプライトの存在を意識せずに x / y / r だけを扱えるようにしている。
      */
     class GameObj {
       constructor(scene, x, y, texture, scale=SCALE) {
         this.scene = scene;
         this.scale = scale;
         this.sprite = scene.add.image(x, y, texture).setScale(scale);
         this.active = true;
       }

       get x() {return this.sprite.x;}
       set x(val) {this.sprite.x = val;}

       get y() {return this.sprite.y;}
       set y(val) {this.sprite.y = val;}

       get src_w() {return this.sprite.width;}
       get src_h() {return this.sprite.height;}

       get w() {return this.src_w * this.scale;}
       get h() {return this.src_h * this.scale;}
       get r() {return (this.w + this.h) / 4;}

       destroy() {
         this.sprite.destroy();
         this.active = false;

       // デフォルトは「アクションを処理しなかった(false)」を返す

     /**
      * シールドを持つオブジェクト（艦船・基地）の基底クラス。
      * 残量の可視化（艦を囲む円とゲージ）と被弾処理をここに集約する。
      */
     class ObjWithShield extends GameObj {
       static SHIELD_MAX = 1; // dummy
       static GAUGE_H = 8;
       static GAUGE_Y_OFFSET = 18;

       constructor(
         scene, x, y, texture,
         shield, shield_gauge_color,
         scale=SCALE
       ) {
         super(scene, x, y, texture, scale);
         this.shield = shield;
         this.shield_gauge_color = shield_gauge_color;

         this.gauge_h = this.constructor.GAUGE_H * scale;
         this.gauge_y = this.h + this.constructor.GAUGE_Y_OFFSET * scale;
         this.gauge_w = this.w;

         this.shield_gauge = this.scene.add.graphics();
         this.shield_circle = this.scene.add.graphics();

         this.spirit = 0.5;
       }

       update() {
         if (! this.active ) {
           if (this.shield_gauge) {
             this.shield_gauge.destroy();
             this.shield_circle.destroy();
           }
           return;
         }

         //
         // draw Shield circle
         //
         const shield_ratio = this.shield / this.constructor.SHIELD_MAX;
         let shield_color = 0xffffff;
         if ( shield_ratio < 0.5 ) {
           shield_color = 0xffff00;
         }
         if ( shield_ratio < 0.25 ) {
           shield_color = 0xff0000;
         }
         this.shield_circle.clear();
         this.shield_circle.lineStyle(3 * shield_ratio, shield_color, 1);
         this.shield_circle.strokeCircle(this.x, this.y, this.r);

         drawGauge(
           this.shield_gauge,
           this.x, this.y + (this.gauge_y * this.scale),
           this.gauge_w, this.gauge_h,
           this.shield / this.constructor.SHIELD_MAX,
           this.shield_gauge_color
         );
       } // update()

       /**
        * シールドの残量比（0.0〜1.0）
        */
       shieldPercent() {
         return (this.shield / this.constructor.SHIELD_MAX);
       }

       /**
        * 恐怖度（0.0〜1.0）。士気の裏返しであり、逃走に転じる閾値になる。
        */
       fear() {
         return (1.0 - this.spirit);
       }

       /**
        * 逃走中かどうか。シールド残量が恐怖度を下回ると逃走に転じる。
        * 士気が高いほど、より深く削られるまで戦い続けることになる。
        */
       isFleeing() {
         return this.shieldPercent() < this.fear();
       }

       /**
        * 被弾処理。シールドが尽きた場合は撃破としてスコアを減点する。
        * 「破壊は割に合わない」というこのゲームの中核ルールを担保する箇所。
        */
       takeDamage(amount) {
         this.shield -= amount;
         if (this.shield <= 0) {
           gameState.score -= SCORE.DESTROY_PENALTY;
           this.die();
         }
       } // takeDamage()

       /**
        * 消滅処理。撃破と宇宙域からの離脱（撤退）の両方から呼ばれる。
        * 描画用のグラフィックスはスプライトとは別管理のため、
        * 個別に破棄しないとシールド円とゲージだけが画面に残ってしまう。
        */
       die() {
         this.shield = 0;
         this.active = false;
         if ( this.shield_gauge ) {
           this.shield_gauge.destroy();
         }
         if ( this.shield_circle ) {
           this.shield_circle.destroy();
         }
         this.destroy();
       } // die()
     } // class ObjWithShield
     
     /**
      * 全ての艦船の基底クラス (SpaceShip)
      */
     class SpaceShip extends ObjWithShield {
       constructor(
         scene, x, y, texture,
         shield, shield_color, scale,
         weapon_power, weapon_area_r, weapon_cost=0
       ) {
         super(scene, x, y, texture, shield, shield_color, scale);
         this.weapon = new Weapon(weapon_power, weapon_area_r, weapon_cost);
       }

       /**
        * なにか衝突したら停止するように座標を計算
        */
       clampDest(destX, destY, ignoreObjs = []) {
         const startX = this.x;
         const startY = this.y;

         const targets = [
           gameObjs.starBase,
           ...gameObjs.federationShips,
           ...gameObjs.enemies,
           ...gameObjs.stars
         ].filter(
           e => e && e.active && e !== this && !ignoreObjs.includes(e)
         );

         if (this instanceof FederationShip || this instanceof EnemyShip) {
           targets.push(gameObjs.player);
         }

         const dx = destX - startX;
         const dy = destY - startY;
         const lenSq = dx * dx + dy * dy;
         if (lenSq < 0.0001) return { x: destX, y: destY };

         let minT = 1.0; 

         for (const tgt of targets) {
           let R = (this.w + tgt.w) / 2;
           const curDist = Phaser.Math.Distance.Between(startX, startY, tgt.x, tgt.y);
           if (curDist < R) {
             const toTargetX = tgt.x - startX;
             const toTargetY = tgt.y - startY;
             if (dx * toTargetX + dy * toTargetY > 0) {
               minT = 0; 
             }
             continue;
           }

           const fx = startX - tgt.x;
           const fy = startY - tgt.y;
           const hit = intersectSegmentCircle(dx, dy, lenSq, fx, fy, R);
           if (!hit) continue;
           if (hit.t1 > 0 && hit.t1 < minT) minT = hit.t1;
         } // for(tgt)

         if (minT < 1.0) {
           const len = Math.sqrt(lenSq);
           const stopT = Math.max(0, minT - 1.5 / len); 
           return { x: startX + dx * stopT, y: startY + dy * stopT };
         }
         return { x: destX, y: destY };
       } // clampDest()

       /**
        * 進行方向に障害物がある場合、少しずつ角度をずらして迂回ルートを探す
        */
       resolveMovement(desiredX, desiredY, speed, ignoreObjs = [], precomputedDirectDest = null) {
         const x = this.x;
         const y = this.y;

         let dx = desiredX - x;
         let dy = desiredY - y;
         let reqDistSq = dx * dx + dy * dy;

         // 直線移動（clampDest）の結果。呼び出し側ですでに計算済みならそれを使い回し、
         // 同じ入力に対する重複計算を避ける（clampDestは副作用のない純粋な計算）。
         let directDest = precomputedDirectDest || this.clampDest(desiredX, desiredY, ignoreObjs);
         let directMoveSq = (directDest.x - x)**2 + (directDest.y - y)**2;

         // 直線移動だけで目的距離の95%以上進めるなら、迂回探索はせずそのまま確定
         if (directMoveSq >= reqDistSq * 0.95) {
           return directDest;
         }

         // ここから先は「直線ではほとんど進めない」場合の迂回探索。
         // 目的方向を基準に、左右(sign = 1 / -1)それぞれ5°刻みで最大90°まで振り、
         // 迂回できる角度を総当たりで探す（見つかった中で目的地に最も近い、または
         // 直進よりマシに動ける角度を採用する）。
         speed /= 2;
         let baseAngle = Math.atan2(dy, dx);
         let bestDest = directDest;
         let minTargetDistSq = (directDest.x - desiredX)**2 + (directDest.y - desiredY)**2;

         for (let sign of [1, -1]) { // 左右どちら向きにも振ってみる
           for (let i = 5; i <= 90; i += 5) { // 5°刻みで角度を広げていく
             let offset = (i * Math.PI) / 180;
             let testAngle = baseAngle + offset * sign;

             let testX = x + Math.cos(testAngle) * speed;
             let testY = y + Math.sin(testAngle) * speed;

             let clamped = this.clampDest(testX, testY, ignoreObjs);

             let moveDistSq = (clamped.x - x)**2 + (clamped.y - y)**2;
             let distToTargetSq = (clamped.x - desiredX)**2 + (clamped.y - desiredY)**2;

             // ほとんど動けない角度は候補にしない
             if (moveDistSq < 10 * 10) {  // XXX TBD
               continue;
             }

             // 現在のベスト候補がほぼ動けていない（スタック中）場合は、
             // 目的地への近さより「動けること」を優先して採用する
             let currentBestMoveSq = (bestDest.x - x)**2 + (bestDest.y - y)**2;
             debugLog('currentBestMoveSq', currentBestMoveSq);
             let stuck = currentBestMoveSq < 1.0;

             if (distToTargetSq < minTargetDistSq || stuck) {
               minTargetDistSq = distToTargetSq;
               debugLog('minTargetDistSq', minTargetDistSq);
               bestDest = clamped;
             }

             // 十分な速度で動ける角度が見つかったら、この振り幅(sign)側の探索は打ち切る
             if (moveDistSq >= (speed * 0.95)**2) {
               break;
             }
           } // for(i)
         } // for (sign)
         return bestDest;
       } // resolveMovement()

       /**
        * ターゲット群に対するステアリングベクトル（斥力・接線力）を計算するコアメソッド
        */
       calcAvoidanceForce(targets, radiusMultiplier, repulsionWeight, tangentialWeight) {
         let accX = 0, accY = 0;
         
         targets.forEach(t => {
           if (!t.active || t === this) return;
           
           const avoidRadius = (this.r + t.r) * radiusMultiplier;
           let dx = this.x - t.x;
           let dy = this.y - t.y;
           let dist = Math.hypot(dx, dy);
           
           if (dist > 0 && dist < avoidRadius) {
             let force = 1.0 - (dist / avoidRadius);
             accX += (dx / dist) * force * repulsionWeight - (dy / dist) * force * tangentialWeight;
             accY += (dy / dist) * force * repulsionWeight + (dx / dist) * force * tangentialWeight;
           }
         });
         
         return { x: accX, y: accY };
       } // calcAvoidanceForce()

       /**
        * 障害物や他ユニットからの回避・分離ベクトルを算出する
        */
       getAvoidanceVector(obstacles) {
         let avoid = this.calcAvoidanceForce(obstacles, 2.2, 0.8, 1.2);
         let sep = this.calcAvoidanceForce(gameObjs.enemies, 2.5, 2.0, 0.0);
         return { x: avoid.x + sep.x, y: avoid.y + sep.y };
       } // getAvoidanceVector()

       /**
        * 逃走時、通常の脅威回避ベクトルに加えて引き寄せられる対象（味方・基地など）を返す。
        * 既定では「なし」。艦種ごとに異なる挙動が必要な場合はオーバーライドする。
        * @return {Array<{target: GameObj, weightMultiplier: number}>}
        */
       getAttractionTargets() {
         return [];
       } // getAttractionTargets()

       /**
        * ターゲットへの方向ベクトル（追尾・逃走）を算出する
        */
       getTargetVector(target, isFleeing) {
         let dirX = 0, dirY = 0;

         if (isFleeing && Array.isArray(target)) {
           target.forEach(t => {
             let dx = this.x - t.x;
             let dy = this.y - t.y;
             let dist = Math.hypot(dx, dy);
             if (dist > 0.001) {
               let weight = 1.0 / dist;
               dirX += (dx / dist) * weight;
               dirY += (dy / dist) * weight;
             }
           });
           // 艦種ごとの追加の引き寄せ対象（例: 連邦艦は基地・自機・僚艦に引き寄せられる）
           this.getAttractionTargets().forEach(({ target: t, weightMultiplier }) => {
             if (!t) return;
             let dx = t.x - this.x;
             let dy = t.y - this.y;
             let dist = Math.hypot(dx, dy);
             if (dist > 0.001) {
               let weight = (1.0 / dist) * weightMultiplier;
               dirX += (dx / dist) * weight;
               dirY += (dy / dist) * weight;
             }
           });

           let fDist = Math.hypot(dirX, dirY);
           if (fDist > 0.000001) {
             dirX /= fDist;
             dirY /= fDist;
           }
         } else {
           let dx = target.x - this.x;
           let dy = target.y - this.y;
           if (isFleeing) {
             dx = -dx;
             dy = -dy;
           }
           let dist = Math.hypot(dx, dy);
           if (dist > 0.001) {
             dirX = dx / dist;
             dirY = dy / dist;
           }
         }
         return { x: dirX, y: dirY };
       } // getTargetVector()

       /**
        * ステアリング計算と障害物回避を統合し、移動先の座標を算出する
        */
       calculateDestination(targetPos, isFleeing = false) {
         let targetVec = this.getTargetVector(targetPos, isFleeing);
         let avoidVec = this.getAvoidanceVector(gameObjs.stars);
         
         let finalX = targetVec.x * 1.0 + avoidVec.x;
         let finalY = targetVec.y * 1.0 + avoidVec.y;

         let finalDist = Math.hypot(finalX, finalY);
         if (finalDist < 0.001) {
           let randomAngle = Math.random() * Math.PI * 2;
           finalX = Math.cos(randomAngle);
           finalY = Math.sin(randomAngle);
           finalDist = 1.0;
         }

         const speed = this.constructor.SPEED;
         let desiredX = this.x + (finalX / finalDist) * speed;
         let desiredY = this.y + (finalY / finalDist) * speed;

         return this.resolveMovement(desiredX, desiredY, speed);
       } // calculateDestination()

       /**
        * Tweenを利用して指定座標へ移動する
        */
       moveTo(destX, destY, duration = TIMING.TURN_DELAY, onComplete = null) {
         this.scene.tweens.add({
           targets: this,
           x: destX,
           y: destY,
           duration: duration,
           onComplete: () => {if (onComplete) {onComplete();}}
         });
       } // moveTo()
     } // class SpaceShip

     /**
      * NPC用基底クラス (SpaceShip を継承)
      */
     class NPCShip extends SpaceShip {
       constructor(scene, x, y, texture, shield, shield_color, scale, weapon_power, weapon_area_r) {
         super(scene, x, y, texture, shield, shield_color, scale, weapon_power, weapon_area_r);

         // 子クラス(EnemyShip / FederationShip) が持つスタティックプロパティを参照して士気を初期化
         this.spirit = this.constructor.SPIRIT.INIT;
         debugLog(`${this.constructor.name}> spirit=${Number(this.spirit).toFixed(3)}`);
       }

       /**
        * ビームの色（子クラスでオーバーライド）
        */
       getBeamColor() {
         return 0xffffff; 
       }
       
       /**
        * 攻撃実行の共通処理
        */
       attack(target, distance) {
         // 自身の scene と getBeamColor() を使用してビームを描画
         fireBeam(this.scene, this, target, this.getBeamColor());
         
         const damage = this.weapon.CalcDamage(distance);
         target.takeDamage(damage);

         // 艦種ごとの攻撃後処理（メッセージ通知や撃破判定）を呼び出し
         this.onAfterAttack(target);
       } // attack()

       /**
        * 攻撃後の派生処理用フック（子クラスで実装）
        */
       onAfterAttack(target) {
         // デフォルトは何もしない
       } // onAfterAttack()

       // --- 評価対象となるターゲット候補リストを取得（子クラスで実装） ---
       getPotentialTargets() {
         return [];
       } // getPotentialTargets()

       // --- 特定のターゲットを評価対象から除外するかどうかの判定（必要に応じて子クラスで実装） ---
       shouldIgnoreTarget(target) {
         return false;
       } // shouldIgnoreTarget()

       // --- 戦術評価の実行 ---
       evaluateTactics() {
         const isFleeing = this.isFleeing();
         let target = null;
         let distToTarget = Infinity;
         let canAttack = false;

         const potentialTargets = this.getPotentialTargets();
         let bestAttackableTarget = null;
         let bestAttackableDist = Infinity;
         let closestTarget = null;
         let closestDist = Infinity;

         potentialTargets.forEach(t => {
           if (!t || !t.active) return;
           if (this.shouldIgnoreTarget(t)) return;

           let d = Phaser.Math.Distance.Between(this.x, this.y, t.x, t.y);
           
           // 最短距離の対象を記録（攻撃不可の場合の追跡目標）
           if (d < closestDist) {
             closestDist = d;
             closestTarget = t;
           }

           // 攻撃可能な対象を評価
           if (!isFleeing && d <= this.weapon.MaxRange() * (1.0 - this.spirit)) {
             let checkBaseObstacle = (t !== gameObjs.starBase);
             if (!isLOSBlocked(this, t, checkBaseObstacle)) {
               if (d < bestAttackableDist) {
                 bestAttackableDist = d;
                 bestAttackableTarget = t;
               }
             }
           }
         }); // forEach

         if (bestAttackableTarget) {
           target = bestAttackableTarget;
           distToTarget = bestAttackableDist;
           canAttack = true;
         } else {
           target = closestTarget;
           distToTarget = closestDist;
           canAttack = false;
         }

         return { target, distToTarget, canAttack, isFleeing };
       } // evaluateTactics()

     } // class NPCShip

     /**
      * 敵艦。撃破ではなく、宇宙域の外へ撤退させることが目的の対象。
      */
     class EnemyShip extends NPCShip {
       static W = 60;
       static SPEED = 40 * SCALE;

       static SHIELD_MAX = 300;
       static SHIELD_RECOVERY_RATE = 0.01;
       static SHIELD_COLOR = 0xff8800;

       static WEAPON = {
         POWER: 90,
         AREA_R: 70,
       };

       static SPIRIT = {
         INIT: 0.5,
         MIN: 0.3,
         MAX: 0.7,
         STEP: 0.05,
         RECOVERY: 0.005,
       };

       constructor(scene, x, y) {

           scene, x, y, 'enemyImg',

         );
       }

         return 0xff00ff;
       }

       // --- 敵艦が攻撃した後の処理 ---
       onAfterAttack(target) {
         const t_shield_p = Math.floor(target.shieldPercent() * 100);

         if (target === gameObjs.player && t_shield_p < 60) {
           if (t_shield_p > 30) {
             setMsg("機関部", `シールド ${t_shield_p}% に低下`, "#ff0");

             setMsg("機関部", `艦長！シールド ${t_shield_p}% 危険です！`, "#f00");
           }
           updateStatus();
         }
         if (target === gameObjs.starBase && t_shield_p < 60) {
           setMsg("基地", `シールド ${t_shield_p}%、至急救援を求む！`, "#ff0");
           if (t_shield_p <= 30) {
             setMsg("基地", `シールド ${t_shield_p}%、至急救援を求む！`, "#f00");
           }
           updateStatus();
         }
         if (target.shield <= 0 && !gameState.isGameOver) {
           if (target === gameObjs.starBase) {
             gameOver("基地", "シールド消失！基地が崩壊...");
           } else if (target === gameObjs.player) {
             gameOver("機関部", "シールド消失！ 船体が崩壊...");
           } else if (target instanceof FederationShip) { // 【修正】配列比較のバグを解消
             setMsg("通信士", "味方との通信が途絶えました", "#f00");
             updateStatus();
           }
         }
       } // onAfterAttack()

       // --- 敵艦のターゲット候補 ---
       getPotentialTargets() {
         const targets = [gameObjs.starBase, ...gameObjs.federationShips];
         if (!gameObjs.player.is_docked) {
           targets.push(gameObjs.player);
         }
         return targets;
       } // getPotentialTargets()

       // 敵艦に対するクリック操作（攻撃）
       onInteract(player, scene, endTurn) {
         if (player.is_docked) {
           setMsg("戦術士官", "ドッキング中のため兵器は使用できません。", "#ff0");
           return true;
         }
         if (player.energy < player.weapon.cost) {
           setMsg("戦術士官", "エネルギー不足で攻撃できません！", "#f00");
           return true;
         }

         // 発射
         player.energy -= player.weapon.cost;
         const dist = Phaser.Math.Distance.Between(player.x, player.y, this.x, this.y);

         if (dist > player.weapon.MaxRange()) {
           setMsg("戦術士官", "射程範囲外のため敵艦にダメージなし", "#ff0");
           fireBeam(scene, player, this, 0x444444);
           endTurn();
           return true;
         }
         if (isLOSBlocked(player, this, false)) {
           setMsg("戦術士官", "障害物に遮られました", "#ff0");
           fireBeam(scene, player, this, 0x444444);
           endTurn();
           return true;
         }

         // 命中
         //setMsg("戦術士官", "攻撃命中！ 敵艦シールド低下！", "#f80");
         const damage = player.weapon.CalcDamage(dist);
         this.takeDamage(damage);
         fireBeam(scene, player, this, 0x00ffff);

         if (!this.active) {
           // 撃墜
           gameObjs.removeEnemy(this);
           spawnEnemy(scene, 0.8, 0.95);
           setMsg("戦術士官", "敵艦を撃破！ 別の新たな敵艦を検知しました！", "#ff0");
         }
         endTurn();
         return true;
       } // onInteract()

     /**
      * ズーム倍率変更
      */
     function changeZoom(scene, amount) {
       let nextZoom = CurZoom;
       if (amount > 0) {
         nextZoom = CurZoom * amount;
       } else if (amount < 0) {
         nextZoom = CurZoom / -amount;
       }
       
       // 最小倍率を 1.0 に強制固定（1倍以下はない）
       CurZoom = Phaser.Math.Clamp(nextZoom, 1.0, CAMERA.ZOOM_MAX);
       
       // ターゲットの切り替えを実行
       updateCameraTarget(scene);
       
       scene.tweens.add({
         targets: scene.cameras.main,
         zoom: CurZoom,
         duration: 250,
         ease: 'Sine.easeInOut'
       });
     } // changeZoom()

     function updateCameraTarget(scene) {
       // 1倍以下のズーム倍率は存在しないように制限
       if (CurZoom <= 1.0) {
         CurZoom = 1.0;
         // 1倍のときはスターベース（AREA_CENTER）を中心とし、追従を解除
         scene.cameras.main.stopFollow();
         scene.cameras.main.centerOn(AREA_CENTER.X, AREA_CENTER.Y);
       } else {
         // 1倍より大きい（2倍、4倍など）ときは自機を中心に追従（見切れ許容）
         scene.cameras.main.startFollow(gameObjs.player.sprite, true, 0.1, 0.1);
       }
     }

     /**
      * 既存の物体と重ならないランダム座標を返す。
      * 中心（基地）からの距離を比率で指定することで、「外縁部に増援を出す」
      * 「中心付近に自機を配置する」を同じ関数で出し分けている。
      * 条件を満たす座標が見つからない場合も、試行回数の上限で必ず打ち切る。
      */
     function getSafeRandPos(dist_min, dist_max){
       let x, y, distToCenter;
       let safe = false;
       let attempts = 0;
       
       // オブジェクト同士が重ならないための最低距離
       const MIN_SPAWN_DIST = PlayerShip.R * 3.5;
       
       while(!safe && attempts < 100) {
         x = Phaser.Math.Between(AREA_CENTER.X - AREA_R, AREA_CENTER.X + AREA_R);
         y = Phaser.Math.Between(AREA_CENTER.Y - AREA_R, AREA_CENTER.Y + AREA_R);
         distToCenter = Phaser.Math.Distance.Between(x, y, AREA_CENTER.X, AREA_CENTER.Y);
         
         if ( distToCenter < AREA_R * dist_min || distToCenter > AREA_R * dist_max ) {
           continue;
         }
         
         safe = true;

         for(let s of [
           ...gameObjs.stars, ...gameObjs.federationShips, ...gameObjs.enemies
         ]) {
           if (s.active && Phaser.Math.Distance.Between(x, y, s.x, s.y) < MIN_SPAWN_DIST) {
             safe = false;
             break;
           }
         }
         attempts++;
       } // while
       return { x, y };
     } // getSafeRandPos()

     /**
      * 線分（始点からdx,dy方向へ、長さの2乗がa）と円（中心が始点からfx,fy、半径radius）
      * の交差判定。線分をt=0(始点)〜t=1(終点)としてパラメータ化した交点位置を返す。
      * 交差しない場合は null。
      * clampDest()（衝突による移動停止）と hasObstacleOnPath()（LOS/経路上の障害物判定）
      * で共通して使う、線分と円の交差の二次方程式を解く部分だけを切り出したもの。
      */
     function intersectSegmentCircle(dx, dy, a, fx, fy, radius) {
       const b = 2 * (fx * dx + fy * dy);
       const c = fx * fx + fy * fy - radius * radius;
       const disc = b * b - 4 * a * c;
       if (disc < 0) {
         return null;
       }
       const sqrtDisc = Math.sqrt(disc);
       return {
         t1: (-b - sqrtDisc) / (2 * a),
         t2: (-b + sqrtDisc) / (2 * a),
       };
     } // intersectSegmentCircle()

     /**
      * src から dst への線分が obj に遮られるか。
      * 始点・終点のごく近傍（t < 0.05 / t > 0.95）は射手自身や目標との接触なので、
      * 遮蔽とはみなさない。
      */
     function hasObstacleOnPath(src, dst, obj) {
       const dx = dst.x - src.x, dy = dst.y - src.y;
       const a = dx * dx + dy * dy;
       if (a < 0.001) {
         return false;
       }
       const fx = src.x - obj.x, fy = src.y - obj.y;
       const hit = intersectSegmentCircle(dx, dy, a, fx, fy, obj.r);
       if (!hit) {
         return false;
       }
       return (hit.t1 > 0.05 && hit.t1 < 0.95) || (hit.t2 > 0.05 && hit.t2 < 0.95);
     } // hasObstacleOnPath()

     /**
      * LOS(Line of Sight、射線)がブロックされてないか？
      */
     function isLOSBlocked(srcObj, targetObj, checkBase = true) {
       // 1. 星（障害物）による遮蔽の判定
       let hitStar = gameObjs.stars.some(s => s.active && hasObstacleOnPath(srcObj, targetObj, s));
       if (hitStar) return true;

       // 2. 基地による遮蔽の判定（基地の見た目のサイズで正確に判定）
       if (checkBase && gameObjs.starBase && gameObjs.starBase.active && gameObjs.starBase.shield > 0) {
         if (hasObstacleOnPath(srcObj, targetObj, gameObjs.starBase)) {
           return true;
         }
       }
       return false;
     } // isLOSBlocked()

     /**
      * クリック（タップ）操作の受け口。
      * 「何をクリックしたか」だけで行動が決まる設計のため、まず対象オブジェクトへ
      * 処理を委ね、どこからも処理されなかった場合にのみ移動へフォールバックする。
      */
     function handlePointerDown(pointer) {
       if (gameState.isGameOver || !gameState.isPlayerTurn) return;

       // 宇宙域外は無視
       if (
         Phaser.Math.Distance.Between(
           pointer.worldX, pointer.worldY, AREA_CENTER.X, AREA_CENTER.Y
         ) >= AREA_R
       ) {
         return;
       }

       if (gameObjs.player.energy < PlayerShip.ENERGY_MIN && !gameObjs.player.is_docked) {
         updateStatus();
         gameOver(
           "コンピュータ",
           "エネルギー枯渇により航行不能。緊急遭難ビーコンを発信し機体を放棄します..."
         );
         return;
       }

       const clickedObj = gameObjs.findObjectAt(pointer.worldX, pointer.worldY);
       const endTurn = () => {
         gameState.isPlayerTurn = false;
         this.time.delayedCall(TIMING.TURN_DELAY, () => npcTurn(this));
         updateStatus();
       };

       // オブジェクトがアクションを処理できればtrueが返る
       const handled = clickedObj?.onInteract(gameObjs.player, this, endTurn);

       if (handled) {
         return;
       }
       
       // 処理されなかった場合（空間クリック、または遠距離基地クリック）は移動へフォールバック
       const targetX = clickedObj ? clickedObj.x : pointer.worldX;
       const targetY = clickedObj ? clickedObj.y : pointer.worldY;
       attemptPlayerMove(this, targetX, targetY, TIMING.TURN_DELAY);

       if (gameObjs.player.energy < PlayerShip.ENERGY_MIN && !gameObjs.player.is_docked) {
         updateStatus();
         gameOver(
           "コンピュータ", "エネルギー枯渇により航行不能。緊急遭難ビーコンを発信します..."
         );
       }
     } // handlePointerDown()

     /**
      * 指定した艦が基地に接触している（ドッキング可能な距離にいる）かどうかを判定する。
      * プレイヤー・連邦艦、共通で使用する。
      */
     function isAdjacentToBase(ship, base) {
       const dist = Phaser.Math.Distance.Between(ship.x, ship.y, base.x, base.y);
       const contactDist = base.r + ship.r + 1.5;
       return dist <= contactDist;
     } // isAdjacentToBase()

     /**
      * 自機が基地に接しており、ドッキングできるかを確認する
      */
     function canDock() {
       return isAdjacentToBase(gameObjs.player, gameObjs.starBase);
     } // canDock()

     /**
      * ドッキング処理：自機を基地の「中央」に移動させる。
      * 補給と引き換えに攻撃手段を失うため、明示的な操作でのみ実行される。
      */
     function dockShip(scene) {
       gameObjs.player.is_docked = true;

       // 補給
       gameObjs.player.shield = PlayerShip.SHIELD_MAX;
       gameObjs.player.energy = PlayerShip.ENERGY_MAX;
       
       // 【変更点】自機を基地の中心（X, Y）へ移動させる
       scene.tweens.add({
         targets: gameObjs.player,
         x: gameObjs.starBase.x,
         y: gameObjs.starBase.y,
         duration: 200,
         ease: 'Sine.easeInOut'
       });
       setMsg("基地", "ドッキング完了。エネルギー補給開始。", "#0ff");
       updateStatus();
     } // dockShip()

     /**
      * 自機の速度を考慮した目的座標を計算する。
      * 移動距離が実質ゼロ（1未満）の場合は null を返す。
      */
     function computeDesiredMove(player, targetX, targetY) {
       const dx = targetX - player.x;
       const dy = targetY - player.y;
       const rawDist = Math.hypot(dx, dy);
       if (rawDist < 1) {
         return null;
       }
       const moveDist = Math.min(rawDist, PlayerShip.SPEED);
       return {
         desiredX: player.x + dx / rawDist * moveDist,
         desiredY: player.y + dy / rawDist * moveDist,
         moveDist,
       };
     } // computeDesiredMove()

     /**
      * ドッキング状態に応じて自機の移動先を解決する。
      * ドッキング解除時は基地から一定距離だけ強制的に離す「押し出し」処理を行う。
      * @return {{destX:number, destY:number, ignoreObjs:Array,
      *           precomputedDirectDest:?{x:number,y:number}}}
      */
     function resolvePlayerDestination(desiredX, desiredY, moveDist) {
       if (gameObjs.player.is_docked) {
         gameObjs.player.is_docked = false;
         gameObjs.player.shield = PlayerShip.SHIELD_MAX;

         const ignoreObjs = [gameObjs.starBase];
         let { x: destX, y: destY } = gameObjs.player.resolveMovement(
           desiredX, desiredY, moveDist, ignoreObjs
         );

         const distFromBase = Phaser.Math.Distance.Between(
           gameObjs.starBase.x, gameObjs.starBase.y, destX, destY
         );
         const minPushDist = StarBase.R + PlayerShip.R;
         if (distFromBase < minPushDist) {
           debugLog('distFromBase', distFromBase, 'minPushDist', minPushDist);
           const pushAngle = Math.atan2(destY - gameObjs.starBase.y, destX - gameObjs.starBase.x);
           destX = gameObjs.starBase.x + Math.cos(pushAngle) * minPushDist;
           destY = gameObjs.starBase.y + Math.sin(pushAngle) * minPushDist;
         }
         return { destX, destY, ignoreObjs, precomputedDirectDest: null };
       }

       // 通常移動およびドッキングを目的とする移動
       const finalDest = gameObjs.player.clampDest(desiredX, desiredY, []);
       return {
         destX: finalDest.x,
         destY: finalDest.y,
         ignoreObjs: [],
         precomputedDirectDest: finalDest,
       };
     } // resolvePlayerDestination()

     /**
      * スタック（ほぼ動けていない）状態を検知し、必要なら扇形探索で迂回先を再計算する。
      * 迂回を試みても動けない場合は cancelled:true を返す。
      */
     function resolveStuckAvoidance(desiredX, desiredY, moveDist, resolved) {
       const { ignoreObjs, precomputedDirectDest } = resolved;
       let destX = resolved.destX;
       let destY = resolved.destY;

       let actualDist = Phaser.Math.Distance.Between(gameObjs.player.x, gameObjs.player.y, destX, destY);
       debugLog('actualDist', actualDist);

       if (actualDist >= 10) { // XXX TBD
         return { destX, destY, actualDist, isRerouted: false, cancelled: false };
       }

       // 扇形探索（resolveMovement）を利用して迂回進路を再計算。
       // 通常移動時は直前に計算済みのclampDest結果を渡し、同じ計算を繰り返さない。
       const avoidDest = gameObjs.player.resolveMovement(
         desiredX, desiredY, moveDist, ignoreObjs, precomputedDirectDest
       );
       destX = avoidDest.x;
       destY = avoidDest.y;
       actualDist = Phaser.Math.Distance.Between(gameObjs.player.x, gameObjs.player.y, destX, destY);
       debugLog('actualDist(2)', actualDist);

       // 迂回を試みても移動不能な場合（四方を完全に囲まれている場合など）キャンセル
       if (actualDist < 0.1) {
         return { destX, destY, actualDist, isRerouted: false, cancelled: true };
       }

       return { destX, destY, actualDist, isRerouted: true, cancelled: false };
     } // resolveStuckAvoidance()

     /**
      * 自機の移動処理（スタック回避および進路変更報告機能を追加）
      */
     function attemptPlayerMove(scene, targetX, targetY, delayBeforeEnemyTurn) {
       const desired = computeDesiredMove(gameObjs.player, targetX, targetY);
       if (!desired) {
         return;
       }
       const { desiredX, desiredY, moveDist } = desired;

       // 目的座標が「基地」かどうかの判定
       const dist_target_to_base = Phaser.Math.Distance.Between(
         targetX, targetY, gameObjs.starBase.x, gameObjs.starBase.y
       );
       const target_is_base = dist_target_to_base <= StarBase.R;

       const resolved = resolvePlayerDestination(desiredX, desiredY, moveDist);
       const stuck = resolveStuckAvoidance(desiredX, desiredY, moveDist, resolved);
       if (stuck.cancelled) {
         setMsg("操舵手", "障害物に接近しすぎてコース設定できません", "#0f0");
         updateStatus();
         return;
       }
       const { destX, destY, actualDist, isRerouted } = stuck;

       const speed_p = (actualDist / PlayerShip.SPEED * 100).toFixed(0);
       const cost = Math.max(1, Math.ceil(actualDist * PlayerShip.MOVE_COST_RATE));
       if ( gameObjs.player.energy - cost < 0 ) {
         setMsg("機関部", "エネルギー不足です", '#ff0');
         updateStatus();
         return;
       }

       // コース変更時のメッセージ
       const shiftDist = Phaser.Math.Distance.Between(desiredX, desiredY, destX, destY);
       if (isRerouted) {
         setMsg("操舵手", `障害物回避のためコース調整。推力 ${speed_p}%`, "#ff0");
       } else if (shiftDist > 5.0 && !target_is_base) {
         setMsg("操舵手", `進路上に障害物。安全距離にて停止。推力 ${speed_p}%`, "#ff0");
       }
       updateStatus();

       gameObjs.player.energy -= cost;
       gameState.isPlayerTurn = false;

       gameObjs.player.moveTo(destX, destY, TIMING.TURN_DELAY, () => {
         scene.time.delayedCall(delayBeforeEnemyTurn, () => npcTurn(scene));
       });

       updateStatus();
     } // attemptPlayerMove()

     /**
      * ビームの描画と発射音の再生。
      * 一定時間後に自動で破棄される、その場限りのグラフィックスとして描く。
      */
     function fireBeam(scene, srcObj, targetObj, color) {
       const beam = scene.add.graphics();
       beam.lineStyle(4, color, 1);
       beam.lineBetween(srcObj.x, srcObj.y, targetObj.x, targetObj.y);
       scene.time.delayedCall(TIMING.BEAM_DUR, () => beam.destroy());

       playBeamSound(srcObj === gameObjs.player || srcObj instanceof FederationShip);
     } // fireBeam(..)

     // ---------------------------------------------------------
     // 敵ターンの処理
     // ---------------------------------------------------------
     /**
      * NPCターン全体の制御（エントリーポイント）
      */
     function npcTurn(scene) {
       if (gameState.isGameOver) {
         return;
       }

       // 敵艦と連邦艦をひとつの配列にまとめて処理する
       const npcs = [...gameObjs.federationShips, ...gameObjs.enemies];

       npcs.forEach(npc => {
         const startDelay = Math.random() * TIMING.ENEMY_DELAY_MAX;
         scene.time.delayedCall(startDelay, () => execNPCAction(scene, npc));
       });

       let totalDelay = (
         TIMING.TURN_DELAY + TIMING.TURN_MARGIN + TIMING.ENEMY_DELAY_MAX
       );
       scene.time.delayedCall(totalDelay, () => finalizeEnemyTurn(scene));
     } // npcTurn()

     /**
      * NPC1体の具体的な行動（思考と実行）
      */
     function execNPCAction(scene, npc) {
       if (gameState.isGameOver || !npc.active) return;

       const context = npc.evaluateTactics();
       debugLog(
         npc.constructor.name,
         "shield", npc.shieldPercent().toFixed(3),
         ", fear", npc.fear().toFixed(3),
       );

       if (context.isFleeing) {
         npcMove(scene, npc, context);
       } else if (context.canAttack) {
         npc.attack(context.target, context.distToTarget);
       } else {
         npcMove(scene, npc, context);
       }
     } // execNPCAction()

     /**
      * NPC 移動処理とシールド回復
      */
     function npcMove(scene, npc, context) {
       let dest;
       let isDocking = false;

       const base = gameObjs.starBase;
       const isBaseActive = base && base.active && base.shield > 0;
       // 連邦艦が、すでに基地に接している（＝前のターンまでに到着済み）かどうか
       const dockableNow = npc instanceof FederationShip && isBaseActive
         && isAdjacentToBase(npc, base);

       if (context.isFleeing) {
         // 連邦艦はすでに基地に接していれば、移動せずドッキング（回復）する
         if (dockableNow) {
           dest = { x: npc.x, y: npc.y };
           isDocking = true;
         }

         // ドッキングしない場合は、通常の逃走（敵・障害物回避）経路を計算。
         // 基地は障害物として扱われるため、連邦艦は接する位置で自然に停止する。
         if (!isDocking) {
           let threats = [gameObjs.player, base];
           if (npc instanceof FederationShip) {
             threats = gameObjs.enemies.filter(e => e.active && e !== npc);
           }
           const targetDest = threats.map(t => ({ x: t.x, y: t.y }));
           dest = npc.calculateDestination(targetDest, context.isFleeing);
         }
       } else { // 逃走中でない場合
         if ( context.target ) {
           // ターゲットがいれば追跡
           const targetDest = { x: context.target.x, y: context.target.y};
           dest = npc.calculateDestination(targetDest, context.isFleeing);
         } else if (dockableNow) {
           // ターゲットがおらず、すでに基地に接していればドッキング（回復）する
           dest = { x: npc.x, y: npc.y };
           isDocking = true;
         } else {
           // ターゲットがいなければ基地へ向かう（接する位置で自然に停止する）
           const targetDest = { x: base.x, y: base.y };
           dest = npc.calculateDestination(targetDest, context.isFleeing);
         }
       } // if (context.isFleeing)

       npc.moveTo(dest.x, dest.y, TIMING.TURN_DELAY, () => {
         npc.x = Math.floor(npc.x);
         npc.y = Math.floor(npc.y);

         const distFromCenter = Phaser.Math.Distance.Between(
           npc.x, npc.y, AREA_CENTER.X, AREA_CENTER.Y
         );
         if (distFromCenter > AREA_R) {
           npc.die();
           if (npc instanceof FederationShip) {
             setMsg("通信士", "味方が戦場から離脱しました", "#88f");
             gameState.score -= SCORE.DESTROY_PENALTY;
           }
           if (npc instanceof EnemyShip) {
             gameObjs.enemies.forEach(e => {
               e.spirit = Math.max(EnemyShip.SPIRIT.MIN, e.spirit - EnemyShip.SPIRIT.STEP);
             });
             if (!gameState.isGameOver) {
               if (getActiveEnemyCount() > 0) {
                 setMsg("副長", "敵艦が戦場から離脱しました", "#0f8");
               } else {
                 setMsg("副長", "すべての敵艦が撤退しました！", "#ff0");
               }
             }
           }
         } // if (distFromCenter > AREA_R)

         // シールド回復処理
         if (isDocking) {
           npc.shield = npc.constructor.SHIELD_MAX;
         } else {
           npc.shield = Math.min(
             npc.constructor.SHIELD_MAX,
             npc.shield + (npc.constructor.SHIELD_MAX * npc.constructor.SHIELD_RECOVERY_RATE)
           );
         }

         // spirit 回復
         if (context.isFleeing) {
           npc.spirit = Math.min(
             npc.constructor.SPIRIT.MAX,
             (npc.spirit + npc.constructor.SPIRIT.RECOVERY)
           );
           debugLog(`npcMove> spirit recover: ${npc.spirit.toFixed(3)}`);
         }
       }); // npc.moveTo()

     } // npcMove()
     
     /**
      * ターン終了処理と次ターンへの準備
      */
     function finalizeEnemyTurn(scene) {
       gameObjs.enemies = gameObjs.enemies.filter(e => e.active);
       
       if (gameObjs.enemies.length === 0 && !gameState.isGameOver) {
         nextMission(scene);
         return;
       }

       if ( gameState.isGameOver ) {
         return;
       }

       gameState.turn++;
       // 減点
       gameState.score -= gameObjs.enemies.filter(e => e.active).length;
       gameState.score -= getActiveFederationShipCount();

       // 増援の出現
       if (gameState.turn % NEW_ENEMY_INTERVAL === 0) {
         spawnEnemy(scene, 0.8, 0.95);

         // spirit
         gameObjs.enemies.forEach(obj => {
           obj.spirit = Math.min(EnemyShip.SPIRIT.MAX, obj.spirit + EnemyShip.SPIRIT.STEP);
           debugLog(`finalizeEnemyTurn> obj.spirit up: ${obj.spirit.toFixed(3)}`);
         });
         setMsg("戦術士官", "新たな敵を検知！", "#ff0")
       }
       if ( gameState.turn % NEW_FEDERATION_INTERVAL === 0 ) {
         // XXX TBD 連邦の援軍が出現する条件
         // gameState.qtyFederationShip はミッション開始時点のスナップショットのため
         // ここでは使わず、現在生存中の連邦艦数をその場で数える
         const qty_enemies = gameObjs.enemies.filter(e => e.active).length;
         const qty_federation = getActiveFederationShipCount();
         debugLog(
           `qty_federation=${qty_federation}, qty_enemies=${qty_enemies}`
         );
         if ( qty_federation < qty_enemies / 2 ) {
           setMsg("通信士", "味方が到着しました！", "#0f0");
           newFederationShip(scene, 0.8, 0.95);
         }
       }

       // 基地の回復
       if ( gameObjs.starBase.shield < StarBase.SHIELD_MAX ) {
         gameObjs.starBase.shield = Math.floor(Math.min(
           StarBase.SHIELD_MAX,
           gameObjs.starBase.shield + (StarBase.SHIELD_MAX * StarBase.SHIELD_RECOVERY_RATE)
         ));
       }

       const enp = gameObjs.player.energy_p(); 
       if ( enp < 30 ) {
         setMsg("機関部", `エネルギー残り ${enp}%`, "#ff0");
       }
       updateStatus();

       gameState.isPlayerTurn = true;
     } // finalizeEnemyTurn()

     /**
      * シールド/エネルギー系ゲージの共通更新処理（数値表示・色・幅を一括更新）
      */
     function updateGaugeDisplay(valueElId, gaugeElId, value, max) {
       const ratio = value / max;
       const color = ratio < 0.3 ? "#f00" : "#0f0";
       document.getElementById(valueElId).style.color = color;
       document.getElementById(valueElId).textContent = value;
       document.getElementById(gaugeElId).style.width = (ratio * 100) + '%';
       document.getElementById(gaugeElId).style.background = color;
     } // updateGaugeDisplay()

     /**
      * ステータスエリア更新
      */
     function updateStatus() {
       const PlayerEnergy = gameObjs.player.energy > 0 ? gameObjs.player.energy : 0;
       const PlayerShield = gameObjs.player.shield > 0 ? gameObjs.player.shield : 0;
       const baseShield = gameObjs.starBase.shield > 0 ? gameObjs.starBase.shield : 0;
       const federationCount = getActiveFederationShipCount() + 1; // 自機を含めて表示
       const enemyCount = getActiveEnemyCount();

       document.getElementById('statusTurn').textContent = `${gameState.turn}`;
       document.getElementById('statusMission').textContent = `${gameState.curMission}`;
       document.getElementById('statusScore').textContent = `${gameState.score}`;

       document.getElementById('statusFederationShipCount').style.color = "#ff0"
       document.getElementById('statusFederationShipCount').textContent = `${federationCount}`;

       document.getElementById('statusEnemyShipCount').style.color = "#ff0"
       document.getElementById('statusEnemyShipCount').textContent = `${enemyCount}`;

       updateGaugeDisplay('statusShipShield', 'gaugeShipShield', PlayerShield, PlayerShip.SHIELD_MAX);
       updateGaugeDisplay('statusShipEnergy', 'gaugeShipEnergy', PlayerEnergy, PlayerShip.ENERGY_MAX);
       updateGaugeDisplay('statusBaseShield', 'gaugeBaseShield', baseShield, StarBase.SHIELD_MAX);
     } // updateStatus()

     /**
      * 次のステージに移行
      */
     function nextMission(scene) {
       const clearedMission = gameState.curMission;
       let bonus = gameState.curMission * 100;
       gameState.score += bonus;
       debugLog(`nextMission> bonus=${bonus}, gameState.score=${gameState.score}`);

       gameState.qtyFederationShip = getActiveFederationShipCount();
       debugLog(`nextMission> gameState.qtyFederationShip=${gameState.qtyFederationShip}`);

       const { list, newIdx } = saveHighScore(
         gameState.score, gameState.turn, clearedMission,
         `MISSION #${clearedMission} CLEARED`, true
       );

       gameState.curMission++;
       QTY.ENEMY++;
       gameState.isPlayerTurn = false;

       gameState.pendingScene = scene;

       setMsg("司令部", `ミッション #${clearedMission} クリア`, '#fff');
       scene.time.delayedCall(
         TIMING.MISSION_OVER, () => showHighScoreOverlay(
           'missionclear', { clearedMission, bonus, list, newIdx }
         )
       );
     } // nextMission()

     /**
      * ゲームオーバー
      */
     function gameOver(from="?", msg="?", clear=false) {
       debugLog(`from=${from}, msg=${msg}, clear=${clear}`);
       const msgstr = from + ">" + msg;
       gameState.isGameOver = true;
       gameState.flagClear = clear;
       gameState.isPlayerTurn = false;
       setMsg(from, msg);
       updateStatus();
       // シーン再起動で確実に止めるため setTimeout ではなく delayedCall を使う。
       // setTimeout だと前のミッションのハイスコア画面が後から開いてしまう。
       gameState.curScene.time.delayedCall(
         TIMING.MISSION_OVER,
         () => showHighScoreOverlay('gameover', { msgstr })
       );
     } // gameOver()

     function loadHighScores() {
       try {
         const raw = localStorage.getItem(HIGHSCORE.STORAGE_KEY);
         return raw ? JSON.parse(raw) : [];
       } catch (e) {
         return [];
       }
     }

     function saveHighScore(score, turns, mission, result, forceSave = false) {
       let list = loadHighScores();
       const now = new Date();
       const dateStr = [
         now.getFullYear(),
         String(now.getMonth() + 1).padStart(2, '0'),
         String(now.getDate()).padStart(2, '0')
       ].join('/');
       if ( gameState.flagClear || forceSave ) {
         list.push({
           score, turns, mission, result,
           gameid: GAME_ID, date: dateStr, _new: true
         });
       }
       list.sort((a, b) => b.score - a.score);
       const newIdx = list.findIndex(s => s._new);
       list = list.slice(0, HIGHSCORE.MAX_ENTRIES);
       const madeIt = list.some(s => s._new);
       // プライベートブラウジングや容量超過で setItem は例外を投げる。
       // 保存に失敗してもミッションクリアの処理は続行させる（記録が
       // 残らないだけで、ゲームは破綻しない）。
       try {
         localStorage.setItem(
           HIGHSCORE.STORAGE_KEY,
           JSON.stringify(list.map(({ _new, ...rest }) => rest))
         );
       } catch (e) {
         debugLog('saveHighScore> failed to save:', e);
       }
       return { list, newIdx: madeIt ? newIdx : -1 };
     }

     function renderHSTable(list) {
       const tbody  = document.getElementById('hsTableBody');
       const noRec  = document.getElementById('hsNoRecord');
       tbody.innerHTML = '';
       if (!list || list.length === 0) {
         noRec.style.display = 'block';
         return;
       }
       noRec.style.display = 'none';
       const rankLabels = ['1ST', '2ND', '3RD', '4TH', '5TH'];
       list.forEach((s, i) => {
         const tr = document.createElement('tr');
         const thisGame = (s.gameid === GAME_ID);
         if ( thisGame ) {
           tr.className = 'hs-new';
         }
         const rank   = rankLabels[i] || `${i + 1}TH`;
         const prefix = thisGame ? '★' : '';
         const displayMission = s.mission !== undefined ? s.mission : '-';
         tr.innerHTML = `
           <td>${prefix}</td>
           <td>${rank}</td>
           <td>${s.score}</td>
           <td>${displayMission}</td>
           <td>${s.turns}</td>
           <td>${s.date}</td>
         `;
         
         // ★追加: 行をクリックした際の処理
         tr.addEventListener('click', () => {
           // スコアを引き継ぐ
           gameState.score = s.score;
           // 記録されたステージの次からスタートする
           gameState.curMission = (s.mission !== undefined ? s.mission : 1) + 1;
           gameState.turn = 1;
           
           // 敵の初期生成数を、進行するステージに合わせて再計算
           // (初期値3 + ステージ進行分)
           QTY.ENEMY = 3 + (gameState.curMission - 1);
           
           gameState.isGameOver = false;
           gameState.flagClear = false;
           gameState.isPlayerTurn = true;
           gameState.pendingScene = null;
           
           // オーバーレイを非表示にする
           document.getElementById('highScoreOverlay').style.display = 'none';
           
           // シーンを再起動
           if (gameState.curScene) {
             gameState.curScene.scene.restart();
           }
         });

         tbody.appendChild(tr);
       });
     } // renderHSTable()

     function showHighScoreOverlay(mode, data = {}) {
       const overlay    = document.getElementById('highScoreOverlay');
       const resultEl   = document.getElementById('hsResultMsg');
       const finalEl    = document.getElementById('hsFinalMsg');
       const closeBtn   = document.getElementById('hsCloseBtn');
       const restartBtn = document.getElementById('hsRestartBtn');

       if (mode === 'missionclear') {
         const { clearedMission, bonus, list, newIdx } = data;
         resultEl.style.color      = '#0f0';
         resultEl.textContent      = `✓ MISSION #${clearedMission} CLEARED!`;
         finalEl.textContent       = `TURNS:${gameState.turn}, MISSION BONUS:+${bonus}, SCORE: ${gameState.score}`;
         renderHSTable(list);
         closeBtn.style.display    = 'none';
         restartBtn.textContent    = '▶ NEXT MISSION';
         restartBtn.style.display  = 'inline-block';
       } else if (mode === 'gameover') {
         const { msgstr } = data;
         resultEl.style.color      = '#ff0';
         resultEl.textContent      = msgstr;
         finalEl.textContent       = `MISSION FAILED: SCORE: ${gameState.score}  ` +
                                     `MISSION #${gameState.curMission}  TURNS: ${gameState.turn}`;
         renderHSTable(loadHighScores());
         closeBtn.style.display    = 'none';
         restartBtn.textContent    = '▶ RESTART';
         restartBtn.style.display  = 'inline-block';
       } else {
         resultEl.style.color      = '#0ff';
         resultEl.textContent      = '▶ HIGH SCORES ◀';
         finalEl.textContent       = `NOW — ` +
                                     `MISSION #${gameState.curMission} TURN: ${gameState.turn} - ` +
                                     `SCORE:${gameState.score}`;
         closeBtn.style.display    = 'inline-block';
         restartBtn.textContent    = '▶ RESTART';
         restartBtn.style.display  = 'inline-block';
         renderHSTable(loadHighScores());
       }
       overlay.style.display = 'flex';
     } // showHighScoreOverlay()

     document.getElementById('viewScoresBtn').addEventListener('click', () => {
       showHighScoreOverlay('view');
     });

     document.getElementById('hsRestartBtn').addEventListener('click', () => {
       if (gameState.pendingScene) {
         document.getElementById('highScoreOverlay').style.display = 'none';
         gameState.turn = 1;
         const s = gameState.pendingScene;
         gameState.pendingScene = null;
         gameState.isPlayerTurn = true;
         s.scene.restart();
       } else {
         location.reload();
       }
     });

     document.getElementById('hsCloseBtn').addEventListener('click', () => {
       document.getElementById('highScoreOverlay').style.display = 'none';
     });
    </script>
  </body>
</html>
