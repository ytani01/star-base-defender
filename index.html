<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Starbase Defender</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
     :root {
       --color-primary: #0ff;
       --color-accent: #08f;
       --color-bg-dark: #111;
       --font-mono: monospace;
       --panel-font-size: clamp(14px, 3.4vw, 30px);
     }
     body {
       margin:0;
       padding:0;
       background:#000;
       overflow:hidden;
       font-family: Arial, sans-serif;
     }
     button {
       font-family: inherit;
       cursor: pointer;
     }

     #gameContainer {
       display: flex;
       flex-direction: column;
       height: 100vh; /* dvh未対応ブラウザ向けのフォールバック */
       height: 100dvh; /* ツールバーの表示/非表示に追従する実際の可視高さ */
     }
     
     #statusPanel {
       background: var(--color-bg-dark);
       color: var(--color-primary);
       padding:15px;
       flex: 0 0 auto;
       /* padding と border を高さに含める。既定の content-box では
          max-height: 40dvh に padding 30px と border 2px が上乗せされ、
          上限のつもりの指定が実際には 40dvh を超えてしまう。 */
       box-sizing: border-box;
       /* 縦画面ではステータス欄が肥大化して宇宙域を圧迫しないよう上限を設ける
          （横画面では下の @media で解除し、これまで通りサイドパネル全高を使う） */
       max-height: 40vh;
       max-height: 40dvh;
       border-bottom:2px solid var(--color-accent);
       overflow-y:auto;
       font-size: var(--panel-font-size);
       font-family: var(--font-mono);
       line-height: 1.1;
     }
     #statusPanel div {
       margin: 1px 5px;
     }

     #statusPanel .status-header {
       display: flex;
       background: #0a0a2a;
       justify-content: space-between;
       align-items: flex-end;
       border-bottom: 1px dashed var(--color-primary);
       padding-bottom: 6px;
       margin-bottom: 10px;
       flex-wrap: wrap;
     }
     #statusPanel .status-header span {
       margin: 0; /* 親の margin 指定をリセット */
     }
     #statusPanel .game-title {
       font-size: 1.1em;
       font-weight: bold;
       color: #fff;
       letter-spacing: 1px;
     }
     #statusPanel .game-credits {
       font-size: 0.8em;
       color: var(--color-accent)
     }
     
     #statusPanel .status-gauge {
       display: inline-block;
       width: 60px;
       height: 1.0em;
       background: #222;
       border: 1px solid var(--color-accent);
       margin-left: 8px;
       vertical-align: middle;
     }
     #statusPanel .status-gauge-fill {
       height: 100%;
       width: 100%;
       background: #0f0;
       transition: width 0.2s ease, background-color 0.2s ease;
       margin: 0;
     }

     #statusPanel #logStatus {
       height: 90px;
       line-height: 1.2;
       /* 禁則処理。既定では長音符や小書き仮名の前でも改行されるため、
          「シ／ールド」のように語が割れて読み取りに一拍かかる。
          報告を一目で読ませるための指定であって、見た目の好みではない。 */
       line-break: strict;
       overflow-y: auto;
       background: #000;
       border: 1px solid rgba(0, 255, 255, 0.2);
       padding: 4px;
       margin-top: 5px;
     }
     #logStatus .log-line {
       margin: 2px 0;
       padding: 1px 4px;
       border-radius: 2px;
     }

     #gameWrapper {
       position: relative;
       flex: 1;
       /* flex アイテムの既定は min-width / min-height: auto のため、中身の
          最小サイズより小さくならない。宇宙域は正方形なので、横画面では
          「画面の高さ」がそのまま最小幅として効いてしまい、ステータス欄を
          除いた残り幅を超えて右へはみ出す。縦横どちらの並びでも縮められる
          よう、両方を 0 にする。 */
       min-height: 0;
       min-width: 0;
       display: flex;             /* 追加: フレックスボックス化 */
       justify-content: flex-start; /* 追加: 左詰め */
       align-items: flex-start;     /* 追加: 上詰め */
       background: #000;          /* 余白部分を黒に */
     }
     #gameCanvas {
       width: 100%;
       height: 100%;
       max-width: 100%;
       max-height: 100%;
       aspect-ratio: 1 / 1;       /* 追加: 常に正方形を保つことで見切れと間延びを防止 */
       /* ズームUIと縦に並ぶ場合に高さを分け合う。height: 100% だけだと
          兄弟が使った分を考慮せず、画面の下へはみ出す。flex-basis を 0 に
          して「残っている分」を主サイズにする（Phaser は FIT なので、
          この箱の中に正方形のキャンバスを収めてくれる） */
       flex: 1 1 0;
       min-height: 0;
       min-width: 0;
     }

     /* 既定は盤面への重ね置き。場所を取らないので宇宙域を絶対に狭めない */
     #zoomUI {
       position: absolute;
       top: 10px;
       left: 10px;
       display: flex;
       flex-direction: column;
       gap: 10px;
       z-index: 1000;
     }

     /* 縦長で高さに余裕がある画面だけ、盤面に重ねず真上へ出す。
        条件は「ステータス欄とズームUIを引いた残りの高さが、画面の幅以上」。
        ステータス欄は最大 40dvh、ズームUIは約 60px なので
        0.6 × 高さ − 60 ≥ 幅、おおむね 幅/高さ ≤ 0.5 に落ちる。
        これを超える画面で真上に出すと宇宙域がそのまま縮むため、
        重ねたままにする（実測: 360x640 で 360→324、320x568 で 320→281）。
        しきい値が正しいかは layout.spec.js が実際の寸法で確かめている。 */
     @media (orientation: portrait) and (max-aspect-ratio: 1 / 2) {
       #gameWrapper {
         flex-direction: column;
       }
       #zoomUI {
         position: static;
         flex-direction: row;
         padding: 6px 10px;
         flex: 0 0 auto;
         /* DOM 上はキャンバスの後ろにあるので、表示順だけ前に出す */
         order: -1;
       }
     }
     #zoomUI button {
       /* タップしやすい最小サイズ(48px)は確保しつつ、画面が小さい端末では
          宇宙域を圧迫しないよう viewport 幅に応じて縮小する */
       width: clamp(48px, 11vw, 68px);
       height: clamp(48px, 11vw, 68px);
       font-size: clamp(24px, 6vw, 34px);
       background: rgba(0, 136, 255, 0.5);
       color: #fff;
       border: 2px solid var(--color-primary);
       border-radius: 30px;
       user-select: none;
     }
     #zoomUI button:active {
       background: rgba(0, 255, 255, 0.8);
       color: #000;
     }

     .panel-btn {
       font-size: 0.9em;
       background: transparent;
       color: var(--color-primary);
       border: 1px solid var(--color-primary);
       padding: 3px 8px;
       border-radius: 3px;
       margin-left: 10px;
       vertical-align: middle;
       transition: background 0.12s, color 0.12s;
     }
     .panel-btn:hover {
       background: var(--color-primary);
       color: #000;
     }

     #highScoreOverlay {
       display: none;
       position: fixed;
       inset: 0;
       background: rgba(0, 0, 20, 0.5);
       z-index: 9999;
       align-items: center;
       justify-content: center;
       font-family: var(--font-mono);
     }
     #hsPanel {
       border: 2px solid var(--color-primary);
       padding: 28px 32px;
       min-width: 500px;
       max-width: 800px;
       width: 92%;
       background: rgba(8, 8, 32, 0.5);
       box-shadow: 0 0 40px rgba(0,255,255,0.9);
     }
     #hsResultMsg {
       text-align: center;
       font-size: clamp(28px, 5vw, 40px);
       letter-spacing: 3px;
       margin: 0 0 6px 0;
     }
     #hsFinalMsg {
       color: #8df;
       text-align: center;
       font-size: clamp(24px, 2.5vw, 40px);
       margin: 0 0 16px 0;
       padding-bottom: 14px;
       border-bottom: 1px solid rgba(0,255,255,0.25);
     }
     .hs-heading {
       color: var(--color-primary);
       font-size: clamp(28px, 3.5vw, 40px);
       letter-spacing: 2px;
       margin-bottom: 8px;
     }
     #hsTableWrap {
       overflow-x: auto;
     }
     #hsTable {
       width: 100%;
       border-collapse: collapse;
       font-size: clamp(24px, 3.2vw, 30px);
       color: #9cf;
       min-width: 260px;
     }
     #hsTable th,
     #hsTable td {
       padding: 6px;
       white-space: nowrap;
     }
     #hsTable th {
       color: var(--color-primary);
       text-align: left;
       padding-top: 4px;
       padding-bottom: 4px;
       border-bottom: 1px solid rgba(0,255,255,0.3);
       letter-spacing: 1px;
     }
     #hsTable tbody tr.hs-new td {
       color: #ff0;
     }
     #hsTable tbody tr {
       cursor: pointer;
       transition: background-color 0.2s;
     }
     #hsTable tbody tr:hover {
       background-color: rgba(0, 255, 255, 0.15);
     }
     #hsNoRecord {
       color: #444;
       text-align: center;
       padding: 14px;
       font-size: clamp(24px, 2.2vw, 40px);
     }
     #hsBtns {
       display: flex;
       gap: 12px;
       justify-content: center;
       margin-top: 20px;
       flex-wrap: wrap;
     }
     .hs-btn {
       padding: 11px 20px;
       font-size: clamp(24px, 2.8vw, 40px);
       background: rgba(0, 100, 200, 0.3);
       color: var(--color-primary);
       border: 2px solid var(--color-primary);
       border-radius: 4px;
       letter-spacing: 1px;
       transition: background 0.15s, color 0.15s;
     }
     .hs-btn:hover,
     .hs-btn:active {
       background: var(--color-primary);
       color: #000;
     }

     @media (orientation: landscape) {
       #gameContainer {
         flex-direction: row;
       }
       #statusPanel {
         /* 横画面ではパネルの幅がそのまま宇宙域の幅を削るため、中身が必要と
            する分だけに詰める。最も長い「Base Shield」の行は、ゲージ 60px と
            左右の余白が固定 px、ラベルと数値が文字サイズ比例なので、必要幅は
            文字サイズの一次式（実測で約 8.5em + 118px）になる。これに余裕を
            足した値。em はパネル自身の --panel-font-size に解決されるので、
            幅は文字サイズを介して画面幅に追従する。
            縮めすぎると行が折り返して読めなくなる。値を変えるときは
            tests/layout.spec.js の「行が折り返さない」を必ず通すこと。 */
         width: calc(9em + 124px);
         max-height: none; /* 縦画面用の上限を解除し、サイドパネルとして全高を使う */
         height: 100vh; /* dvh未対応ブラウザ向けのフォールバック */
         height: 100dvh; /* ツールバーの表示/非表示に追従する実際の可視高さ */
         border-bottom: none;
         border-right: 2px solid var(--color-accent);
       }
       /* 横長画面でのパネル内のフォントサイズ微調整 */
       :root {
         --panel-font-size: clamp(16px, 2vw, 22px);
       }
     }
    </style>
  </head>
  <body>
    <div id="gameContainer">
      <div id="statusPanel">
        <div class="status-header">
          <span class="game-title" id="gameTitle">StarBase Defender</span>
          <div class="game-credits">&copy; 2026 ytani01</div>
        </div>
        <div>
          Turn
          <span id="statusMission">1</span>-<span id="statusTurn">1</span>
          <button class="panel-btn" id="viewScoresBtn">SCORE
            <span id="statusScore">100</span>
          </button>
        </div>
        <div>
          Shield
          <div class="status-gauge"><div id="gaugeShipShield" class="status-gauge-fill"></div></div>
          <span id="statusShipShield">0</span>
        </div>
        <div>
          Energy
          <div class="status-gauge"><div id="gaugeShipEnergy" class="status-gauge-fill"></div></div>
          <span id="statusShipEnergy">0</span>
        </div>
        <div>
          Base Shield
          <div class="status-gauge"><div id="gaugeBaseShield" class="status-gauge-fill"></div></div>
          <span id="statusBaseShield">0</span>
        </div>
        <div>
          Federation
          <span id="statusFederationShipCount">1</span>
          (Dock <span id="statusFederationShipDocked">0</span>)
        </div>
        <div>
          Enemy
          <span id="statusEnemyShipCount">1</span>
        </div>
        <div id="logStatus"></div>
      </div>
      
      <div id="gameWrapper">
        <div id="gameCanvas"></div>
        <div id="zoomUI">
          <button id="zoomIn">＋</button>
          <button id="zoomOut">－</button>
        </div>
      </div>
    </div>

    <div id="highScoreOverlay">
      <div id="hsPanel">
        <h2 id="hsResultMsg"></h2>
        <p id="hsFinalMsg"></p>
        <div class="hs-heading">▶ HIGH SCORES ◀</div>
        <div id="hsTableWrap">
          <table id="hsTable">
            <thead>
              <tr>
                <th></th>
                <th>RANK</th>
                <th>SCORE</th>
                <th>MISSION</th>
                <th>TURNS</th>
                <th>DATE</th>
              </tr>
            </thead>
            <tbody id="hsTableBody"></tbody>
          </table>
          <div id="hsNoRecord">--- NO RECORDS YET ---</div>
        </div>
        <div id="hsBtns">
          <button class="hs-btn" id="hsRestartBtn">▶ RESTART</button>
          <button class="hs-btn" id="hsCloseBtn">✕ CLOSE</button>
        </div>
      </div>
    </div>
    
    <script>
     "use strict";
     // ---------------------------------------------------------
     // 設定・定数の定義
     // ---------------------------------------------------------
     const GAME_ID = Phaser.Utils.String.UUID();

     // リリースのたびに更新する。表示は起動時に .game-title へ流し込む
     const GAME_NAME = 'StarBase Defender';
     const VERSION = 'v0.4.4';

     const TIMING = {
       BEAM_DUR: 400,
       TURN_DELAY: 400,
       TURN_MARGIN: 0,
       MISSION_OVER: 3000,
       ENEMY_DELAY_MAX: 500, // 敵艦の動作のズレ
     };

     const QTY = {
       STAR: 30,
       // ミッション1の敵の数。以降のミッションでは1隻ずつ増えるが、
       // 現在の数は実行時の状態なので gameState.enemyQty が持つ。
       ENEMY_INIT: 3,
     };

     const NEW_ENEMY_INTERVAL = 25;
     const NEW_FEDERATION_INTERVAL = 40;  // TBD
     
     const SCALE = 0.5;

     const AREA_R = 300;

     const PLAY_AREA = {
       WIDTH: AREA_R * 2 + 30,
       HEIGHT: AREA_R * 2 + 30,
     };
     const AREA_CENTER = {
       X: PLAY_AREA.WIDTH / 2,
       Y: PLAY_AREA.HEIGHT / 2,
     };

     const CAMERA = {
       ZOOM_MIN: 1.0,
       ZOOM_MAX: 4.0,
       STEP: 2.0,
     };

     const SCORE = {
       INIT: 100,
       DESTROY_PENALTY: 50,
       // ミッションクリアのボーナス。深いミッションほど大きく加点する
       CLEAR_BONUS_PER_MISSION: 100,
     };
     const HIGHSCORE = {
       MAX_ENTRIES: 5,
       STORAGE_KEY: 'starbaseDefenderScores'
     };

     // ログの色。色は装飾ではなく意味を持つ（Product Guidelines 参照）。
     // 新しい色を足す前に、既存の意味で表現できないか検討すること。
     const MSG_COLOR = {
       INFO: '#0ff',      // シアン: 通常の情報（既定）
       SELF: '#8ff',      // 淡いシアン: 自機の状態変化
       FRIENDLY: '#88f',  // 青紫: 味方（連邦艦）に関する報告
       WARN: '#ff0',      // 黄: 警告・注意
       DANGER: '#f00',    // 赤: 危険・致命
       GOOD: '#0f0',      // 緑: 良好・安全
       RETREAT: '#0f8',   // 青緑: 敵の撤退（こちらに有利な戦況変化）
       ENEMY: '#f40',     // オレンジ: 敵に起きた出来事
       PLAIN: '#fff',     // 白: 意味の色を持たせない告知
     };

     // ログの発信者。担当は Product Guidelines の一覧と1対1で対応する。
     const SPEAKER = {
       HELM: '操舵手',          // 移動・進路・コース変更
       TACTICAL: '戦術士官',    // 攻撃・射程・敵の検知
       ENGINE: '機関部',        // エネルギー・自機シールド
       COMMS: '通信士',         // 味方（連邦艦）に関する報告
       XO: '副長',              // 戦況全体の要約
       BASE: '基地',            // 基地からの通信・ドッキング
       COMMAND: '司令部',       // ミッションの成否
       COMPUTER: 'コンピュータ', // 自動的な状況判定・緊急時の宣告
     };

     // ログとして保持する行数。超えた分は古いものから捨てる。
     const LOG_MAX_LINES = 50;

     // 宇宙域に描く色（Phaser の 0xRRGGBB 形式）。CSS 用の MSG_COLOR とは
     // 別に持つが、意味の割り当ては Product Guidelines に従う。
     const DRAW_COLOR = {
       BEAM_PLAYER: 0x00ffff,      // シアン: 自機のフェイザー
       BEAM_FEDERATION: 0x0088ff,  // 青: 味方のフェイザー
       BEAM_ENEMY: 0xff00ff,       // マゼンタ: 敵のフェイザー
       BEAM_NEUTRAL: 0xffffff,     // 白: 艦種を特定しない既定のビーム
       BEAM_MISS: 0x444444,        // 灰: 無駄撃ち（射程外・障害物）
       SHIELD_OK: 0xffffff,        // 白: シールドに余裕がある
       SHIELD_LOW: 0xffff00,       // 黄: シールド低下
       SHIELD_CRITICAL: 0xff0000,  // 赤: シールド危険
       RANGE_FRIENDLY: 0x00ffff,   // シアン: 自軍の射程円
       RANGE_ENEMY: 0xffff00,      // 黄: 敵の射程円
       BOUNDARY: 0x0088ff,         // 青: 宇宙域の境界
       DOCKING_RING: 0x02ffff,     // シアン: ドッキング中を示す輪

       // 艦体・構造物の色。preload() でスプライトを描くときに使う
       // 自機と味方は同系色にして「自軍」であることを示しつつ、明度で
       // 差をつける。盤面で最初に目を留めるべきは自機なので自機を明るく
       // 置き、味方は一段落とす。色相まで分けると自軍がばらけて見える
       HULL_PLAYER: 0x66ddff,      // 明るいシアン: 自機
       HULL_FEDERATION: 0x4488ff,  // 青: 連邦艦（味方）
       HULL_ENEMY: 0x008800,       // 緑: 敵艦
       HULL_BASE: 0x88ffff,        // 淡いシアン: 基地
       HULL_STAR: 0xa0a0a0,        // 灰: 恒星（障害物）
     };

     // 残量に応じて表示を切り替える比率（0.0〜1.0）
     const DISPLAY_THRESHOLD = {
       SHIELD_LOW: 0.5,       // シールド円が黄に変わる
       SHIELD_CRITICAL: 0.25, // シールド円が赤に変わる
       GAUGE_DANGER: 0.3,     // ステータス欄のゲージが赤に変わる
     };

     // 乗員が報告を上げる残量（％）。読み手に危機感を伝えるための区切りであり、
     // ゲームバランスそのものではない。
     const REPORT_THRESHOLD = {
       SHIELD_WARN: 60,    // これを下回ると被弾を報告し始める
       SHIELD_DANGER: 30,  // これ以下は危険として強い色で告げる
       ENERGY_WARN: 30,    // ターン終了時にエネルギー残量を警告する
     };

     // デバッグログの有効/無効切り替え。開発時に true にすると各種ログが出力される。
     const DEBUG = false;

     /**
      * デバッグ用ログ出力（DEBUG=true のときのみ console.log する）
      */
     function debugLog(...args) {
       if (DEBUG) {
         console.log(...args);
       }
     } // debugLog()

     /**
      * ゲーム進行状態（ターン・スコア・ミッション進行・シーン参照など）を
      * カプセル化するクラス。gameObjs と同様、単一インスタンスとして扱う。
      */
     class GameState {
       constructor() {
         this.turn = 1;
         this.curMission = 1;
         this.score = SCORE.INIT;
         this.isPlayerTurn = true;
         this.isGameOver = false;
         this.flagClear = false;
         this.pendingScene = null;
         this.curScene = null;
         this.qtyFederationShip = 0;
         // 現在のミッションで出現させる敵の数（ミッションごとに増える）
         this.enemyQty = QTY.ENEMY_INIT;
         // 現在のカメラ倍率
         this.zoom = CAMERA.ZOOM_MIN;
       }

       /**
        * スコアを増減させる。計算そのものは calc*() 側にあり、ここは
        * 適用するだけ。書き換えの入口をひとつに保つ。
        * @param {number} delta 増減値（減点なら負の値）
        */
       addScore(delta) {
         this.score += delta;
       }

       /**
        * 次のミッションを開始できる状態にする（NEXT MISSION から呼ばれる）。
        * スコア・ミッション番号・敵の数は nextMission() が更新済みのため
        * ここでは触らない。ミッションクリア経由でしか到達しないので、
        * isGameOver / flagClear も落とす必要がない。
        */
       resetForNewMission() {
         this.turn = 1;
         this.isPlayerTurn = true;
         this.pendingScene = null;
       }

       /**
        * ハイスコアの記録から再開できる状態にする。
        * 記録されたミッションの「次」から始めるため、敗北状態の解除まで
        * 含めてここで面倒を見る（敗北後の画面から呼ばれるため）。
        * @param {{score:number, mission:(number|undefined)}} record ハイスコア1件
        */
       resumeFrom(record) {
         this.score = record.score;
         this.curMission = (record.mission !== undefined ? record.mission : 1) + 1;
         this.turn = 1;
         // 敵の初期生成数を、再開するミッションに合わせて再計算する
         this.enemyQty = QTY.ENEMY_INIT + (this.curMission - 1);
         this.isGameOver = false;
         this.flagClear = false;
         this.isPlayerTurn = true;
         this.pendingScene = null;
       }
     } // class GameState

     // グローバルなゲーム進行状態インスタンス
     const gameState = new GameState();

     // ---------------------------------------------------------
     // 純粋な計算
     //
     // ここに置く関数は gameState / gameObjs を参照せず、引数だけで
     // 結果が決まる。将来テストを導入するとしたら、まずこの範囲が対象に
     // なる（Tech Stack「テストと静的解析」参照）。
     // ここへ関数を足すときは、グローバル状態を読まないことを守ること。
     // ---------------------------------------------------------

     /**
      * 線分（始点からdx,dy方向へ、長さの2乗がa）と円（中心が始点からfx,fy、半径radius）
      * の交差判定。線分をt=0(始点)〜t=1(終点)としてパラメータ化した交点位置を返す。
      * 交差しない場合は null。
      * clampDest()（衝突による移動停止）と hasObstacleOnPath()（LOS/経路上の障害物判定）
      * で共通して使う、線分と円の交差の二次方程式を解く部分だけを切り出したもの。
      */
     function intersectSegmentCircle(dx, dy, a, fx, fy, radius) {
       const b = 2 * (fx * dx + fy * dy);
       const c = fx * fx + fy * fy - radius * radius;
       const disc = b * b - 4 * a * c;
       if (disc < 0) {
         return null;
       }
       const sqrtDisc = Math.sqrt(disc);
       return {
         t1: (-b - sqrtDisc) / (2 * a),
         t2: (-b + sqrtDisc) / (2 * a),
       };
     } // intersectSegmentCircle()

     /**
      * src から dst への線分が obj に遮られるか。
      * 始点・終点のごく近傍（t < 0.05 / t > 0.95）は射手自身や目標との接触なので、
      * 遮蔽とはみなさない。
      */
     function hasObstacleOnPath(src, dst, obj) {
       const dx = dst.x - src.x, dy = dst.y - src.y;
       const a = dx * dx + dy * dy;
       if (a < 0.001) {
         return false;
       }
       const fx = src.x - obj.x, fy = src.y - obj.y;
       const hit = intersectSegmentCircle(dx, dy, a, fx, fy, obj.r);
       if (!hit) {
         return false;
       }
       return (hit.t1 > 0.05 && hit.t1 < 0.95) || (hit.t2 > 0.05 && hit.t2 < 0.95);
     } // hasObstacleOnPath()

     /**
      * src から dst への射線が、渡された障害物のいずれかに遮られるか。
      * 「どれを障害物とみなすか」は状況によって変わるため、集める側と
      * 判定する側を分けてある（集める側は isLOSBlocked()）。
      * @param {{x:number, y:number}} src 始点
      * @param {{x:number, y:number}} dst 終点
      * @param {Array<GameObj>} obstacles 遮蔽物の候補
      * @return {boolean} 遮られていれば true
      */
     function isPathBlockedBy(src, dst, obstacles) {
       return obstacles.some(o => hasObstacleOnPath(src, dst, o));
     } // isPathBlockedBy()

     /**
      * ターン経過による減点。宇宙域に艦が残っているほど不利になり、
      * もたつくと損をする（Product Guide「スコアの考え方」）。
      * @param {number} enemyCount 生存している敵艦の数
      * @param {number} federationCount 生存している連邦艦の数
      * @return {number} スコアの増減（負の値）
      */
     function calcTurnPenalty(enemyCount, federationCount) {
       return -(enemyCount + federationCount);
     } // calcTurnPenalty()

     /**
      * 艦を1隻失ったときの減点。撃破も戦場からの離脱も同じ扱いとし、
      * 「破壊は割に合わない」という中核ルールを支える。
      * @return {number} スコアの増減（負の値）
      */
     function calcShipLossPenalty() {
       return -SCORE.DESTROY_PENALTY;
     } // calcShipLossPenalty()

     /**
      * ミッションクリアのボーナス。到達の深さを評価する。
      * @param {number} mission クリアしたミッション番号
      * @return {number} スコアの増減（正の値）
      */
     function calcMissionClearBonus(mission) {
       return mission * SCORE.CLEAR_BONUS_PER_MISSION;
     } // calcMissionClearBonus()

     // グローバルメソッド
     // ---------------------------------------------------------

     /**
      * 生存中の連邦艦の数（自機は含まない）
      */
     function getActiveFederationShipCount() {
       return gameObjs.federationShips.filter(f => f.active).length;
     } // getActiveFederationShipCount()

     /**
      * 基地にドッキング中の艦の数。
      * ドッキング中の艦は補給を受ける代わりに戦力から外れるため、
      * 「Federation の数のうち何隻が今は戦えないか」として表示する。
      * Federation の表示数が自機を含むので、こちらも自機を含めて数える。
      */
     function getDockedShipCount() {
       const federationDocked =
         gameObjs.federationShips.filter(f => f.active && f.isDocked).length;
       return federationDocked + (gameObjs.player.isDocked ? 1 : 0);
     } // getDockedShipCount()

     /**
      * 生存中の敵艦の数。
      * 配列には撃破・撤退済みの艦が残っている場合があるため、
      * 表示や判定には必ずこの関数を通した数を使う。
      */
     function getActiveEnemyCount() {
       return gameObjs.enemies.filter(enemy => enemy.active).length;
     } // getActiveEnemyCount()

     /**
      * ゲージの描画
      */     
     function drawGauge(g, cx, cy, width, height, ratio, color) {
       g.clear();
       if (!isFinite(cy)) {
         return;
       }

       const x = cx - width / 2;
       const y = cy - height / 2;
       
       g.fillStyle(0x888888, 1);
       g.fillRect(x, y, width, height);
       
       const r = Math.max(0, Math.min(1, ratio));
       if (r > 0) {
         g.fillStyle(color, 1);
         g.fillRect(x, y, width * r, height);
       }
     } // drawGauge()

     /**
      * 宇宙域境界の描画
      */
     function drawBoundary(){
       gameObjs.boundaryGraphics.clear();
       gameObjs.boundaryGraphics.lineStyle(2, DRAW_COLOR.BOUNDARY, 1);
       gameObjs.boundaryGraphics.strokeCircle(AREA_CENTER.X, AREA_CENTER.Y, AREA_R);
     } // drawBoundary()

     /**
      * 戦況ログに1行追加する（複数行スクロール対応）。
      * 発信者を必ず伴わせることで、どの担当からの報告かを一目で判別できるようにする。
      * @param {string} from 発信者（操舵手・戦術士官・機関部など）
      * @param {string} msg 表示するテキスト（空文字の場合はログを全消去）
      * @param {string} fg 文字色。緊急度を色で示すために使う
      */
     function setMsg(from="", msg="", fg=MSG_COLOR.INFO) {
       const el = document.getElementById('logStatus');
       
       // msgが空文字（ゲームオーバー時などの画面クリア命令）の場合は全消去
       if (!msg) {
         el.innerHTML = '';
         return;
       }

       let msgstr = from + '>' + msg;
       
       let s = String(gameState.curMission).padStart(3,"0");
       s += ".";
       s += String(gameState.turn).padStart(4,"0");
       s += " "
       s += msgstr;
       msgstr = s;

       // 新しいログ行のDOM要素を作成
       const line = document.createElement('div');
       line.className = 'log-line';
       line.style.color = fg;
       line.textContent = msgstr;

       // ログ領域の末尾に追加
       el.appendChild(line);

       // メモリ及びパフォーマンス対策: ログが50行を超えたら古い行から削除
       while (el.children.length > LOG_MAX_LINES) {
         el.removeChild(el.firstChild);
       }

       // 最新のメッセージが見えるように最下部へスクロール位置を調整
       el.scrollTop = el.scrollHeight;
     } // setMsg()

     /**
      * 艦載フェイザーアレイ 照射音ジェネレーター
      * @param {boolean} isPlayer 
      */
     function playBeamSound(isPlayer) {
       if (!window.audioCtx) {
         window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
       }
       if (window.audioCtx.state === 'suspended') {
         window.audioCtx.resume();
       }

       const ctx = window.audioCtx;
       let now = ctx.currentTime

       // ビームの持続時間（TIMING.BEAM_DURに合わせて500ms）
       let duration = TIMING.BEAM_DUR / 1000;
       if (! isPlayer) {
         duration = TIMING.BEAM_DUR / 1000 / 3 * 2;
       }

       // 1. エンベロープ用ゲイン（音量の時間変化）
       const envelope = ctx.createGain();
       envelope.gain.setValueAtTime(0, now);
       envelope.gain.linearRampToValueAtTime(0.3, now + 0.02); // 瞬時に立ち上がる
       envelope.gain.linearRampToValueAtTime(0.2, now + duration * 0.3); // 持続
       envelope.gain.linearRampToValueAtTime(0.1, now + duration * 0.6); // 持続
       envelope.gain.linearRampToValueAtTime(0.05, now + duration * 0.8); // 持続
       envelope.gain.linearRampToValueAtTime(0, now + duration); // 鋭く遮断

       // 2. メインオシレーター（鋸歯状波で厚みのある音色を作る）
       const osc = ctx.createOscillator();
       osc.type = 'sawtooth';
       if (isPlayer) {
         osc.frequency.setValueAtTime(800, now);
       } else {
         osc.frequency.setValueAtTime(600, now);
       }
       
       // 3. フィルター（高音域を強調し、エネルギー感を出す）
       const filter = ctx.createBiquadFilter();
       filter.type = 'lowpass';
       filter.frequency.setValueAtTime(2000, now);
       filter.Q.value = 10;

       // 4. LFO（ウネリの生成）
       // 25Hzで揺らすことでTNG以降のフェイザー特有の「ビームが振動している感じ」を作る
       const lfo = ctx.createOscillator();
       lfo.type = 'sine';
       lfo.frequency.value = 20;
       const lfoGain = ctx.createGain();
       lfoGain.gain.value = 150; // 揺らぎの深さ
       //lfoGain.gain.value = 200; // 揺らぎの深さ

       // ルーティング
       lfo.connect(lfoGain);
       lfoGain.connect(osc.frequency); // 周波数を揺らす（ビブラート）
       
       osc.connect(filter);
       filter.connect(envelope);
       envelope.connect(ctx.destination);

       // 再生
       osc.start(now);
       lfo.start(now);
       osc.stop(now + duration);
       lfo.stop(now + duration);
     } // playBeamSound()
     
     // ---------------------------------------------------------
     // クラス定義
     // ---------------------------------------------------------

     /**
      * 空間内のオブジェクトを管理するコンテキスト
      */
     class GameObjs {
       constructor() {
         this.player = null;
         this.starBase = null;
         this.federationShips = [];
         this.enemies = [];
         this.stars = [];
         // 射程円・宇宙域の境界を描くための描画用オブジェクト
         this.rangeGraphics = null;
         this.boundaryGraphics = null;
       }

       findObjectAt(x, y) {
         // 配列の先頭から優先的に評価（敵艦 -> 基地 -> 自機）
         const clickables = [...this.enemies, this.starBase, this.player];
         return clickables.find(e => {
           if (!e || !e.active) return false;
           return Phaser.Math.Distance.Between(x, y, e.x, e.y) < e.r;
         });
       }

       /**
        * 撃破・撤退した敵を配列から取り除く。配列の入れ替えを
        * このクラスの中に閉じ込め、外から代入させないための入口。
        */
       purgeInactive() {
         this.enemies = this.enemies.filter(e => e.active);
       }

       // 敵の追加・削除を管理
       addEnemy(enemy) {
         this.enemies.push(enemy);
       }
       removeEnemy(enemy) {
         this.enemies = this.enemies.filter(e => e !== enemy);
       }

       // 連邦艦の追加を管理
       addFederation(ship) {
         this.federationShips.push(ship);
       }

       /**
        * 移動の妨げになるものの一覧。動く側から見れば「自分以外のすべて」
        * なので艦種で場合分けはせず、除外したいものを ignore で渡す。
        * @param {Array<GameObj>=} ignore 障害物とみなさないもの（通常は自分自身）
        * @return {Array<GameObj>} 生存している障害物
        */
       getObstacles(ignore = []) {
         return [
           this.starBase,
           ...this.stars,
           ...this.enemies,
           ...this.federationShips,
           this.player,
         ].filter(o => o && o.active && !ignore.includes(o));
       }
     } // GameObjs

     // グローバルなコンテキストインスタンス
     const gameObjs = new GameObjs();

     /**
      * 兵器クラス
      */
     class Weapon {
       static MAX_DAMAGE_RATIO = 0.2;  // 最大射程距離のダメージ比率
       
       constructor(maxPower, areaR, cost=0) {
         debugLog(`Weapon> maxPower=${maxPower}, areaR=${areaR}, const=${cost}`);
         this.maxPower = maxPower;
         this.areaR = areaR;
         this.cost = cost;
       }
       
       effectiveRange() {
         return this.areaR;
       }
       
       maxRange() {
         return Math.floor(this.areaR * Math.sqrt(1 / this.constructor.MAX_DAMAGE_RATIO - 1));
       }

       /**
        * 距離に応じた武器の威力減衰率（有効度）を計算する
        */
       effectiveness(distance) {
         const x = distance / this.areaR;
         return 1 / (1 + x * x);
       }

       calcDamage(distance) {
         return Math.floor(this.maxPower * this.effectiveness(distance));
       }
     } // class Weapon

     /**
      * 空間に存在する全オブジェクトの基底クラス。
      * 座標とサイズは Phaser のスプライトへ委譲しており、ゲームロジック側は
      * スプライトの存在を意識せずに x / y / r だけを扱えるようにしている。
      */
     class GameObj {
       constructor(scene, x, y, texture, scale=SCALE) {
         this.scene = scene;
         this.scale = scale;
         this.sprite = scene.add.image(x, y, texture).setScale(scale);
         this.active = true;
       }

       get x() {return this.sprite.x;}
       set x(val) {this.sprite.x = val;}

       get y() {return this.sprite.y;}
       set y(val) {this.sprite.y = val;}

       get srcW() {return this.sprite.width;}
       get srcH() {return this.sprite.height;}

       get w() {return this.srcW * this.scale;}
       get h() {return this.srcH * this.scale;}
       get r() {return (this.w + this.h) / 4;}

       destroy() {
         this.sprite.destroy();
         this.active = false;
       }

       // デフォルトは「アクションを処理しなかった(false)」を返す
       onInteract(player, scene, endTurn) {
         return false;
       }

       /**
        * 連邦側（自機・味方）かどうか。敵味方で色や効果音を変える箇所が
        * 複数あるため、呼び出し側で instanceof を並べずに済ませる。
        */
       isFriendly() {
         return false;
       }

     } // class GameObj

     /**
      * シールドを持つオブジェクト（艦船・基地）の基底クラス。
      * 残量の可視化（艦を囲む円とゲージ）と被弾処理をここに集約する。
      */
     class ObjWithShield extends GameObj {
       static SHIELD_MAX = 1; // dummy
       static GAUGE_H = 8;
       static GAUGE_Y_OFFSET = 18;

       constructor(
         scene, x, y, texture,
         shield, shieldGaugeColor,
         scale=SCALE
       ) {
         super(scene, x, y, texture, scale);
         this.shield = shield;
         this.shieldGaugeColor = shieldGaugeColor;

         this.gaugeH = this.constructor.GAUGE_H * scale;
         this.gaugeY = this.h + this.constructor.GAUGE_Y_OFFSET * scale;
         this.gaugeW = this.w;

         this.shieldGauge = this.scene.add.graphics();
         this.shieldCircle = this.scene.add.graphics();
       }

       update() {
         if (! this.active) {
           if (this.shieldGauge) {
             this.shieldGauge.destroy();
             this.shieldCircle.destroy();
           }
           return;
         }

         //
         // draw Shield circle
         //
         const shieldRatio = this.shield / this.constructor.SHIELD_MAX;
         let shieldColor = DRAW_COLOR.SHIELD_OK;
         if (shieldRatio < DISPLAY_THRESHOLD.SHIELD_LOW) {
           shieldColor = DRAW_COLOR.SHIELD_LOW;
         }
         if (shieldRatio < DISPLAY_THRESHOLD.SHIELD_CRITICAL) {
           shieldColor = DRAW_COLOR.SHIELD_CRITICAL;
         }
         this.shieldCircle.clear();
         this.shieldCircle.lineStyle(3 * shieldRatio, shieldColor, 1);
         this.shieldCircle.strokeCircle(this.x, this.y, this.r);

         drawGauge(
           this.shieldGauge,
           this.x, this.y + (this.gaugeY * this.scale),
           this.gaugeW, this.gaugeH,
           this.shield / this.constructor.SHIELD_MAX,
           this.shieldGaugeColor
         );
       } // update()

       /**
        * シールドの残量比（0.0〜1.0）
        */
       shieldPercent() {
         return (this.shield / this.constructor.SHIELD_MAX);
       }

       /**
        * 被弾処理。シールドが尽きた場合は撃破としてスコアを減点する。
        * 「破壊は割に合わない」というこのゲームの中核ルールを担保する箇所。
        */
       takeDamage(amount) {
         this.shield -= amount;
         if (this.shield <= 0) {
           gameState.addScore(calcShipLossPenalty());
           this.die();
         }
       } // takeDamage()

       /**
        * 消滅処理。撃破と宇宙域からの離脱（撤退）の両方から呼ばれる。
        * 描画用のグラフィックスはスプライトとは別管理のため、
        * 個別に破棄しないとシールド円とゲージだけが画面に残ってしまう。
        */
       die() {
         this.shield = 0;
         this.active = false;
         if (this.shieldGauge) {
           this.shieldGauge.destroy();
         }
         if (this.shieldCircle) {
           this.shieldCircle.destroy();
         }
         this.destroy();
       } // die()
     } // class ObjWithShield
     
     /**
      * 全ての艦船の基底クラス (SpaceShip)
      */
     class SpaceShip extends ObjWithShield {
       // 障害物に接触する手前で止まる余裕。ぴったり接触させると、次の移動で
       // 重なった状態から始まってしまうため、常にこの分だけ離して停止する。
       static STOP_MARGIN = 1.5;
       // これ未満しか進めない移動は「ほぼ動けていない」とみなす
       static MIN_MOVE_DIST = 10;
       // 目的距離（または速度）のこの割合まで進めれば十分とみなし、
       // 迂回路の探索を打ち切る
       static ENOUGH_MOVE_RATIO = 0.95;

       constructor(
         scene, x, y, texture,
         shield, shieldColor, scale,
         weaponPower, weaponAreaR, weaponCost=0
       ) {
         super(scene, x, y, texture, shield, shieldColor, scale);
         this.weapon = new Weapon(weaponPower, weaponAreaR, weaponCost);
       }

       /**
        * なにか衝突したら停止するように座標を計算。
        * destTarget に「到達したい対象」（基地など）を渡すと、その対象に
        * 接触して止まる場合だけ STOP_MARGIN を適用せず、接触位置ちょうどで
        * 止める。手前で止めると停止位置と接触判定の閾値が重なり、ドッキング
        * できるかどうかが座標の丸め誤差で決まってしまうため。
        * @param {number} destX 目的座標
        * @param {number} destY 目的座標
        * @param {Array} ignoreObjs 障害物とみなさないオブジェクト
        * @param {?GameObj} destTarget 到達したい対象（障害物ではなく目的地）
        * @return {{x:number, y:number}} 停止する座標
        */
       clampDest(destX, destY, ignoreObjs = [], destTarget = null) {
         const startX = this.x;
         const startY = this.y;

         // 自分自身は障害物にならない。自機が呼んだ場合も、ここで自機が
         // 除かれるため艦種による場合分けは要らない。
         const targets = gameObjs.getObstacles([this, ...ignoreObjs]);

         const dx = destX - startX;
         const dy = destY - startY;
         const lenSq = dx * dx + dy * dy;
         if (lenSq < 0.0001) return { x: destX, y: destY };

         let minT = 1.0;
         // 最も手前で当たるものが destTarget 自身かどうか（＝到達して止まるのか、
         // 途中の障害物に阻まれて止まるのか）
         let stopsAtDestTarget = false;

         for (const tgt of targets) {
           let R = (this.w + tgt.w) / 2;
           const curDist = Phaser.Math.Distance.Between(startX, startY, tgt.x, tgt.y);
           if (curDist < R) {
             const toTargetX = tgt.x - startX;
             const toTargetY = tgt.y - startY;
             if (dx * toTargetX + dy * toTargetY > 0) {
               minT = 0;
               stopsAtDestTarget = false;
             }
             continue;
           }

           const fx = startX - tgt.x;
           const fy = startY - tgt.y;
           const hit = intersectSegmentCircle(dx, dy, lenSq, fx, fy, R);
           if (!hit) continue;
           if (hit.t1 > 0 && hit.t1 < minT) {
             minT = hit.t1;
             stopsAtDestTarget = (tgt === destTarget);
           }
         } // for(tgt)

         if (minT < 1.0) {
           const len = Math.sqrt(lenSq);
           const margin = stopsAtDestTarget ? 0 : SpaceShip.STOP_MARGIN;
           const stopT = Math.max(0, minT - margin / len);
           return { x: startX + dx * stopT, y: startY + dy * stopT };
         }
         return { x: destX, y: destY };
       } // clampDest()

       /**
        * 進行方向に障害物がある場合、少しずつ角度をずらして迂回ルートを探す
        */
       resolveMovement(
         desiredX, desiredY, speed, ignoreObjs = [],
         precomputedDirectDest = null, destTarget = null
       ) {
         const x = this.x;
         const y = this.y;

         let dx = desiredX - x;
         let dy = desiredY - y;
         const reqDistSq = dx * dx + dy * dy;

         // 直線移動（clampDest）の結果。呼び出し側ですでに計算済みならそれを使い回し、
         // 同じ入力に対する重複計算を避ける（clampDestは副作用のない純粋な計算）。
         const directDest = precomputedDirectDest
                         || this.clampDest(desiredX, desiredY, ignoreObjs, destTarget);
         const directMoveSq = (directDest.x - x)**2 + (directDest.y - y)**2;

         // 直線移動だけで目的距離の95%以上進めるなら、迂回探索はせずそのまま確定
         if (directMoveSq >= reqDistSq * SpaceShip.ENOUGH_MOVE_RATIO) {
           return directDest;
         }

         // ここから先は「直線ではほとんど進めない」場合の迂回探索。
         // 目的方向を基準に、左右(sign = 1 / -1)それぞれ5°刻みで最大90°まで振り、
         // 迂回できる角度を総当たりで探す（見つかった中で目的地に最も近い、または
         // 直進よりマシに動ける角度を採用する）。
         speed /= 2;
         const baseAngle = Math.atan2(dy, dx);
         let bestDest = directDest;
         let minTargetDistSq = (directDest.x - desiredX)**2 + (directDest.y - desiredY)**2;

         for (let sign of [1, -1]) { // 左右どちら向きにも振ってみる
           for (let i = 5; i <= 90; i += 5) { // 5°刻みで角度を広げていく
             const offset = (i * Math.PI) / 180;
             const testAngle = baseAngle + offset * sign;

             const testX = x + Math.cos(testAngle) * speed;
             const testY = y + Math.sin(testAngle) * speed;

             const clamped = this.clampDest(testX, testY, ignoreObjs, destTarget);

             const moveDistSq = (clamped.x - x)**2 + (clamped.y - y)**2;
             const distToTargetSq = (clamped.x - desiredX)**2 + (clamped.y - desiredY)**2;

             // ほとんど動けない角度は候補にしない
             if (moveDistSq < SpaceShip.MIN_MOVE_DIST ** 2) {
               continue;
             }

             // 現在のベスト候補がほぼ動けていない（スタック中）場合は、
             // 目的地への近さより「動けること」を優先して採用する
             const currentBestMoveSq = (bestDest.x - x)**2 + (bestDest.y - y)**2;
             debugLog('currentBestMoveSq', currentBestMoveSq);
             let stuck = currentBestMoveSq < 1.0;

             if (distToTargetSq < minTargetDistSq || stuck) {
               minTargetDistSq = distToTargetSq;
               debugLog('minTargetDistSq', minTargetDistSq);
               bestDest = clamped;
             }

             // 十分な速度で動ける角度が見つかったら、この振り幅(sign)側の探索は打ち切る
             if (moveDistSq >= (speed * SpaceShip.ENOUGH_MOVE_RATIO) ** 2) {
               break;
             }
           } // for(i)
         } // for (sign)
         return bestDest;
       } // resolveMovement()

       /**
        * ターゲット群に対するステアリングベクトル（斥力・接線力）を計算するコアメソッド
        */
       calcAvoidanceForce(targets, radiusMultiplier, repulsionWeight, tangentialWeight) {
         let accX = 0, accY = 0;
         
         targets.forEach(t => {
           if (!t.active || t === this) return;
           
           const avoidRadius = (this.r + t.r) * radiusMultiplier;
           let dx = this.x - t.x;
           let dy = this.y - t.y;
           let dist = Math.hypot(dx, dy);
           
           if (dist > 0 && dist < avoidRadius) {
             const force = 1.0 - (dist / avoidRadius);
             accX += (dx / dist) * force * repulsionWeight - (dy / dist) * force * tangentialWeight;
             accY += (dy / dist) * force * repulsionWeight + (dx / dist) * force * tangentialWeight;
           }
         });
         
         return { x: accX, y: accY };
       } // calcAvoidanceForce()

       /**
        * 障害物や他ユニットからの回避・分離ベクトルを算出する
        */
       getAvoidanceVector(obstacles) {
         const avoid = this.calcAvoidanceForce(obstacles, 2.2, 0.8, 1.2);
         const sep = this.calcAvoidanceForce(gameObjs.enemies, 2.5, 2.0, 0.0);
         return { x: avoid.x + sep.x, y: avoid.y + sep.y };
       } // getAvoidanceVector()

       /**
        * 逃走時、通常の脅威回避ベクトルに加えて引き寄せられる対象（味方・基地など）を返す。
        * 既定では「なし」。艦種ごとに異なる挙動が必要な場合はオーバーライドする。
        * @return {Array<{target: GameObj, weightMultiplier: number}>}
        */
       getAttractionTargets() {
         return [];
       } // getAttractionTargets()

       /**
        * ターゲットへの方向ベクトル（追尾・逃走）を算出する
        */
       getTargetVector(target, isFleeing) {
         let dirX = 0, dirY = 0;

         if (isFleeing && Array.isArray(target)) {
           target.forEach(t => {
             let dx = this.x - t.x;
             let dy = this.y - t.y;
             let dist = Math.hypot(dx, dy);
             if (dist > 0.001) {
               const weight = 1.0 / dist;
               dirX += (dx / dist) * weight;
               dirY += (dy / dist) * weight;
             }
           });
           // 艦種ごとの追加の引き寄せ対象（例: 連邦艦は基地・自機・僚艦に引き寄せられる）
           this.getAttractionTargets().forEach(({ target: t, weightMultiplier }) => {
             if (!t) return;
             let dx = t.x - this.x;
             let dy = t.y - this.y;
             let dist = Math.hypot(dx, dy);
             if (dist > 0.001) {
               const weight = (1.0 / dist) * weightMultiplier;
               dirX += (dx / dist) * weight;
               dirY += (dy / dist) * weight;
             }
           });

           const fDist = Math.hypot(dirX, dirY);
           if (fDist > 0.000001) {
             dirX /= fDist;
             dirY /= fDist;
           }
         } else {
           let dx = target.x - this.x;
           let dy = target.y - this.y;
           if (isFleeing) {
             dx = -dx;
             dy = -dy;
           }
           let dist = Math.hypot(dx, dy);
           if (dist > 0.001) {
             dirX = dx / dist;
             dirY = dy / dist;
           }
         }
         return { x: dirX, y: dirY };
       } // getTargetVector()

       /**
        * ステアリング計算と障害物回避を統合し、移動先の座標を算出する。
        * destTarget には「到達したい対象」を渡す（clampDest 参照）。
        */
       calculateDestination(targetPos, isFleeing = false, destTarget = null) {
         const targetVec = this.getTargetVector(targetPos, isFleeing);
         const avoidVec = this.getAvoidanceVector(gameObjs.stars);
         
         let finalX = targetVec.x * 1.0 + avoidVec.x;
         let finalY = targetVec.y * 1.0 + avoidVec.y;

         let finalDist = Math.hypot(finalX, finalY);
         if (finalDist < 0.001) {
           const randomAngle = Math.random() * Math.PI * 2;
           finalX = Math.cos(randomAngle);
           finalY = Math.sin(randomAngle);
           finalDist = 1.0;
         }

         const speed = this.constructor.SPEED;
         const desiredX = this.x + (finalX / finalDist) * speed;
         const desiredY = this.y + (finalY / finalDist) * speed;

         return this.resolveMovement(desiredX, desiredY, speed, [], null, destTarget);
       } // calculateDestination()

       /**
        * Tweenを利用して指定座標へ移動する
        */
       moveTo(destX, destY, duration = TIMING.TURN_DELAY, onComplete = null) {
         this.scene.tweens.add({
           targets: this,
           x: destX,
           y: destY,
           duration: duration,
           onComplete: () => {if (onComplete) {onComplete();}}
         });
       } // moveTo()
     } // class SpaceShip

     /**
      * NPC用基底クラス (SpaceShip を継承)
      */
     class NPCShip extends SpaceShip {
       constructor(scene, x, y, texture, shield, shieldColor, scale, weaponPower, weaponAreaR) {
         super(scene, x, y, texture, shield, shieldColor, scale, weaponPower, weaponAreaR);

         // 子クラス(EnemyShip / FederationShip) が持つスタティックプロパティを参照して士気を初期化
         this.spirit = this.constructor.SPIRIT.INIT;
         debugLog(`${this.constructor.name}> spirit=${Number(this.spirit).toFixed(3)}`);
       }

       /**
        * ビームの色（子クラスでオーバーライド）
        */
       getBeamColor() {
         return DRAW_COLOR.BEAM_NEUTRAL;
       }
       
       /**
        * 攻撃実行の共通処理
        */
       attack(target, distance) {
         // 自身の scene と getBeamColor() を使用してビームを描画
         fireBeam(this.scene, this, target, this.getBeamColor());
         
         const damage = this.weapon.calcDamage(distance);
         target.takeDamage(damage);

         // 艦種ごとの攻撃後処理（メッセージ通知や撃破判定）を呼び出し
         this.onAfterAttack(target);
       } // attack()

       /**
        * 攻撃後の派生処理用フック（子クラスで実装）
        */
       onAfterAttack(target) {
         // デフォルトは何もしない
       } // onAfterAttack()

       // --- 評価対象となるターゲット候補リストを取得（子クラスで実装） ---
       getPotentialTargets() {
         return [];
       } // getPotentialTargets()

       // --- 特定のターゲットを評価対象から除外するかどうかの判定（必要に応じて子クラスで実装） ---
       shouldIgnoreTarget(target) {
         return false;
       } // shouldIgnoreTarget()

       // --- 戦術評価の実行 ---
       evaluateTactics() {
         const isFleeing = this.isFleeing();
         let target = null;
         let distToTarget = Infinity;
         let canAttack = false;

         const potentialTargets = this.getPotentialTargets();
         let bestAttackableTarget = null;
         let bestAttackableDist = Infinity;
         let closestTarget = null;
         let closestDist = Infinity;

         potentialTargets.forEach(t => {
           if (!t || !t.active) return;
           if (this.shouldIgnoreTarget(t)) return;

           const d = Phaser.Math.Distance.Between(this.x, this.y, t.x, t.y);
           
           // 最短距離の対象を記録（攻撃不可の場合の追跡目標）
           if (d < closestDist) {
             closestDist = d;
             closestTarget = t;
           }

           // 攻撃可能な対象を評価
           if (!isFleeing && d <= this.weapon.maxRange() * (1.0 - this.spirit)) {
             const checkBaseObstacle = (t !== gameObjs.starBase);
             if (!isLOSBlocked(this, t, checkBaseObstacle)) {
               if (d < bestAttackableDist) {
                 bestAttackableDist = d;
                 bestAttackableTarget = t;
               }
             }
           }
         }); // forEach

         if (bestAttackableTarget) {
           target = bestAttackableTarget;
           distToTarget = bestAttackableDist;
           canAttack = true;
         } else {
           target = closestTarget;
           distToTarget = closestDist;
           canAttack = false;
         }

         return { target, distToTarget, canAttack, isFleeing };
       } // evaluateTactics()

       /**
        * 恐怖度（0.0〜1.0）。士気の裏返しであり、逃走に転じる閾値になる。
        */
       fear() {
         return (1.0 - this.spirit);
       }

       /**
        * 逃走中かどうか。シールド残量が恐怖度を下回ると逃走に転じる。
        * 士気が高いほど、より深く削られるまで戦い続けることになる。
        */
       isFleeing() {
         return this.shieldPercent() < this.fear();
       }

       /**
        * 基地のドックを使えるか。使えるのは連邦艦だけなので既定は false。
        */
       canDockAtBase() {
         return false;
       }

       /**
        * 逃走時に距離を取りたい相手。「何を怖がるか」は艦種で異なるため、
        * 呼び出し側で艦種を見分けずに済むようクラス側に持たせる。
        * @return {Array<GameObj>} 距離を取る対象
        */
       getFleeThreats() {
         return [gameObjs.player, gameObjs.starBase];
       }

       /**
        * 宇宙域の外へ出たときの処理。撤退が戦局に与える意味は艦種で
        * 正反対のため、サブクラスで実装する。既定では何もしない。
        */
       onLeaveArea() {
       }

     } // class NPCShip

     /**
      * エネルギーを持つ艦の基底クラス（現状は自機のみが継承する）。
      * 移動・攻撃・シールド回復の全てが同一のエネルギーを消費するため、
      * 残量をシールドゲージの直下に並べて常時見えるようにしている。
      */
     class ObjWithEnergy extends SpaceShip {
       static ENERGY_MAX = 1;

       constructor(
         scene, x, y, texture,
         shield, gaugeColor,
         energy, energyColor,
         scale = SCALE,
         weaponPower = 0, weaponAreaR = 0, weaponCost = 0
       ) {
         // 親クラス (SpaceShip) へパラメータを渡す
         super(
           scene, x, y, texture, shield, gaugeColor, scale, weaponPower, weaponAreaR, weaponCost
         );
         this.energy = energy;
         this.energyGaugeColor = energyColor;

         this.energyGauge = this.scene.add.graphics();
       }

       energyPercent() {
         return Math.floor(this.energy / this.constructor.ENERGY_MAX * 100);
       }

       update() {
         super.update();
         drawGauge(
           this.energyGauge,
           this.x, this.y + (this.gaugeY * this.scale) + this.gaugeH + 1,
           this.gaugeW, this.gaugeH,
           this.energy / this.constructor.ENERGY_MAX,
           this.energyGaugeColor
         );          
       }
     } // class ObjWithEnergy

     /**
      * 恒星。移動を妨げ、射線を遮る障害物として機能する。
      */
     class Star extends GameObj {
       static W = 40;
       static RANGE = {
         MIN: 0.25,
         MAX: 0.85,
       };
       constructor(scene, x, y) {
         super(scene, x, y, 'starImg');
       }
     } // class Star

     /**
      * 防衛対象の宇宙基地。
      * プレイヤーにとっては補給地点であると同時に、射線を遮る障害物でもある。
      * 基地のシールドが尽きるとゲームオーバーになる。
      */
     class StarBase extends ObjWithShield {
       static W = 100;
       static R = StarBase.W / 2 * SCALE;
       static SHIELD_MAX = 4000;
       static SHIELD_RECOVERY_RATE = 0.005;
       static SHIELD_COLOR = 0x00ffff;
       static DOCKING_RANGE = 50 * SCALE;
       // 接触したとみなす許容差。NPC は移動後に座標を整数へ丸めるため、
       // 接触位置ちょうどで止めても最大 √2 だけ離れうる。それを吸収する。
       static CONTACT_TOLERANCE = 1.5;

       constructor(scene, x, y) {
         super(scene, x, y, 'baseImg', StarBase.SHIELD_MAX, StarBase.SHIELD_COLOR);

         this.gaugeY = this.gaugeY + this.gaugeH / 2 * 3;
         this.sprite.setDepth(1);
         this.shieldGauge.setDepth(1);
       }

       update() {
         super.update();

         // ドッキング状態
         if (gameObjs.player.isDocked) {
           gameObjs.rangeGraphics.lineStyle(5, DRAW_COLOR.DOCKING_RING, 1);
           gameObjs.rangeGraphics.strokeCircle(
             gameObjs.starBase.x, gameObjs.starBase.y, StarBase.DOCKING_RANGE - 3
           );
         }
       } // update()

       // 基地に対するクリック操作
       onInteract(player, scene, endTurn) {
         if (player.isDocked) {
           setMsg(SPEAKER.BASE, "ドッキング中");
           endTurn();
           return true;
         }

         if (canDock()) {
           dockShip(scene);
           endTurn();
           return true;
         }

         // 遠距離にいる場合は false を返し、通常の移動ロジックへとフォールバックさせる
         return false;
       } // onInteract()

     } // class StarBase

     /**
      * 敵艦。撃破ではなく、宇宙域の外へ撤退させることが目的の対象。
      */
     class EnemyShip extends NPCShip {
       static W = 60;
       static SPEED = 40 * SCALE;

       static SHIELD_MAX = 300;
       static SHIELD_RECOVERY_RATE = 0.01;
       static SHIELD_COLOR = 0xff8800;

       static WEAPON = {
         POWER: 90,
         AREA_R: 70,
       };

       static SPIRIT = {
         INIT: 0.5,
         MIN: 0.3,
         MAX: 0.7,
         STEP: 0.05,
         RECOVERY: 0.005,
       };

       constructor(scene, x, y) {
         super(
           scene, x, y, 'enemyImg', 
           EnemyShip.SHIELD_MAX, EnemyShip.SHIELD_COLOR, SCALE,
           EnemyShip.WEAPON.POWER, EnemyShip.WEAPON.AREA_R
         );
       }

       getBeamColor() {
         return DRAW_COLOR.BEAM_ENEMY;
       }

       // --- 敵艦が攻撃した後の処理 ---
       onAfterAttack(target) {
         const targetShieldPercent = Math.floor(target.shieldPercent() * 100);

         if (target === gameObjs.player
             && targetShieldPercent < REPORT_THRESHOLD.SHIELD_WARN) {
           if (targetShieldPercent > REPORT_THRESHOLD.SHIELD_DANGER) {
             setMsg(SPEAKER.ENGINE, `シールド ${targetShieldPercent}% に低下`, MSG_COLOR.WARN);
           } else {
             setMsg(SPEAKER.ENGINE, `艦長！シールド ${targetShieldPercent}% 危険です！`, MSG_COLOR.DANGER);
           }
           updateStatus();
         }
         if (target === gameObjs.starBase
             && targetShieldPercent < REPORT_THRESHOLD.SHIELD_WARN) {
           setMsg(SPEAKER.BASE, `シールド ${targetShieldPercent}%、至急救援を求む！`, MSG_COLOR.WARN);
           if (targetShieldPercent <= REPORT_THRESHOLD.SHIELD_DANGER) {
             setMsg(SPEAKER.BASE, `シールド ${targetShieldPercent}%、至急救援を求む！`, MSG_COLOR.DANGER);
           }
           updateStatus();
         }
         if (target.shield <= 0 && !gameState.isGameOver) {
           if (target === gameObjs.starBase) {
             gameOver(SPEAKER.BASE, "シールド消失！基地が崩壊...");
           } else if (target === gameObjs.player) {
             gameOver(SPEAKER.ENGINE, "シールド消失！ 船体が崩壊...");
           } else if (target instanceof FederationShip) { // 【修正】配列比較のバグを解消
             setMsg(SPEAKER.COMMS, "味方との通信が途絶えました", MSG_COLOR.DANGER);
             updateStatus();
           }
         }
       } // onAfterAttack()

       /**
        * override: 敵艦が撤退すると、残った敵の士気が下がる。
        * 「撃破ではなく追い返す」ことに報いるための処理。
        */
       onLeaveArea() {
         gameObjs.enemies.forEach(e => {
           e.spirit = Math.max(
             EnemyShip.SPIRIT.MIN, e.spirit - EnemyShip.SPIRIT.STEP
           );
         });
         if (gameState.isGameOver) {
           return;
         }
         if (getActiveEnemyCount() > 0) {
           setMsg(SPEAKER.XO, "敵艦が戦場から離脱しました", MSG_COLOR.RETREAT);
         } else {
           setMsg(SPEAKER.XO, "すべての敵艦が撤退しました！", MSG_COLOR.WARN);
         }
       } // onLeaveArea()

       // --- 敵艦のターゲット候補 ---
       // ドッキング中の艦は基地の中にいるため狙わない（攻撃は基地が受ける）
       getPotentialTargets() {
         const targets = [
           gameObjs.starBase,
           ...gameObjs.federationShips.filter(f => !f.isDocked),
         ];
         if (!gameObjs.player.isDocked) {
           targets.push(gameObjs.player);
         }
         return targets;
       } // getPotentialTargets()

       // 敵艦に対するクリック操作（攻撃）
       onInteract(player, scene, endTurn) {
         if (player.isDocked) {
           setMsg(SPEAKER.TACTICAL, "ドッキング中のため兵器は使用できません。", MSG_COLOR.WARN);
           return true;
         }
         if (player.energy < player.weapon.cost) {
           setMsg(SPEAKER.TACTICAL, "エネルギー不足で攻撃できません！", MSG_COLOR.DANGER);
           return true;
         }

         // 発射
         player.energy -= player.weapon.cost;
         const dist = Phaser.Math.Distance.Between(player.x, player.y, this.x, this.y);

         if (dist > player.weapon.maxRange()) {
           setMsg(SPEAKER.TACTICAL, "射程範囲外のため敵艦にダメージなし", MSG_COLOR.WARN);
           fireBeam(scene, player, this, DRAW_COLOR.BEAM_MISS);
           endTurn();
           return true;
         }
         if (isLOSBlocked(player, this, false)) {
           setMsg(SPEAKER.TACTICAL, "障害物に遮られました", MSG_COLOR.WARN);
           fireBeam(scene, player, this, DRAW_COLOR.BEAM_MISS);
           endTurn();
           return true;
         }

         // 命中
         //setMsg(SPEAKER.TACTICAL, "攻撃命中！ 敵艦シールド低下！", "#f80");
         const damage = player.weapon.calcDamage(dist);
         this.takeDamage(damage);
         fireBeam(scene, player, this, DRAW_COLOR.BEAM_PLAYER);

         if (!this.active) {
           // 撃墜
           gameObjs.removeEnemy(this);
           spawnEnemy(scene, 0.8, 0.95);
           setMsg(SPEAKER.TACTICAL, "敵艦を撃破！ 別の新たな敵艦を検知しました！", MSG_COLOR.WARN);
         }
         endTurn();
         return true;
       } // onInteract()

         if (shieldDeficit <= 0) {
           setMsg(SPEAKER.ENGINE, "シールドはすでに最大です。", MSG_COLOR.PLAIN);
           return true;
         }

         const energySupply = Math.min(this.energy, shieldDeficit);
         if (energySupply <= 0) {
           setMsg(SPEAKER.ENGINE, "エネルギー不足により、シールドを補強できません！");
           return true;
         }

         this.energy -= energySupply;
         this.shield += energySupply;

         setMsg(SPEAKER.ENGINE, `シールドアップ。エネルギー残り ${this.energyPercent()}%`, MSG_COLOR.SELF);
         endTurn();
         return true;
       } // onInteract()

       }

     /**
      * ズーム倍率変更
      */
     function changeZoom(scene, amount) {
       let nextZoom = gameState.zoom;
       if (amount > 0) {
         nextZoom = gameState.zoom * amount;
       } else if (amount < 0) {
         nextZoom = gameState.zoom / -amount;
       }
       
       // 最小倍率を 1.0 に強制固定（1倍以下はない）
       gameState.zoom = Phaser.Math.Clamp(nextZoom, CAMERA.ZOOM_MIN, CAMERA.ZOOM_MAX);
       
       // ターゲットの切り替えを実行
       updateCameraTarget(scene);
       
       scene.tweens.add({
         targets: scene.cameras.main,
         zoom: gameState.zoom,
         duration: 250,
         ease: 'Sine.easeInOut'
       });
     } // changeZoom()

     /**
      * ズーム倍率に応じてカメラのターゲットを切り替える
      */
     function updateCameraTarget(scene) {
       // 1倍以下のズーム倍率は存在しないように制限
       if (gameState.zoom <= CAMERA.ZOOM_MIN) {
         gameState.zoom = CAMERA.ZOOM_MIN;
         // 1倍のときはスターベース（AREA_CENTER）を中心とし、追従を解除
         scene.cameras.main.stopFollow();
         scene.cameras.main.centerOn(AREA_CENTER.X, AREA_CENTER.Y);
       } else {
         // 1倍より大きい（2倍、4倍など）ときは自機を中心に追従（見切れ許容）
         scene.cameras.main.startFollow(gameObjs.player.sprite, true, 0.1, 0.1);
       }
     }

     /**
